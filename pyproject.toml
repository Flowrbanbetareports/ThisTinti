[project]
name = "thistinti"
version = "3.4.0a7+rc.15"
description = "Document integrity and discrepancy review platform"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.coverage.run]
source = ["app"]
omit = ["app/local_launcher.py"]

[tool.coverage.report]
# Ratchet from the qualified 2026-08-28 main baseline (6865/7593 ~= 90.4096%).
# Raise this value when coverage improves; do not lower it to accommodate new code.
fail_under = 90.40
precision = 2
show_missing = true
