name: One-shot document ID priority patch

on:
  push:
    branches:
      - benchmark/dirty-public-corpus-22
    paths:
      - scripts/_patch_document_id_priority.py
      - .github/workflows/one-shot-document-id-priority.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: benchmark/dirty-public-corpus-22
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Apply conservative priority rule
        run: python scripts/_patch_document_id_priority.py
      - name: Validate focused parser behavior
        run: |
          ruff format app/parsers/pdf_text.py tests/test_pdf_semantics.py tests/test_parsers.py
          ruff check app/parsers/pdf_text.py tests/test_pdf_semantics.py tests/test_parsers.py
          pytest -q tests/test_pdf_semantics.py tests/test_parsers.py
      - name: Remove one-shot machinery
        run: |
          rm scripts/_patch_document_id_priority.py
          rm .github/workflows/one-shot-document-id-priority.yml
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Prefer explicit document labels over incidental references'
          git push origin HEAD:benchmark/dirty-public-corpus-22
