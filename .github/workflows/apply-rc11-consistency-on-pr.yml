name: Apply RC11 Consistency on PR

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/apply_rc11_consistency.py
      - tests/test_operational_center.py
      - .github/workflows/apply-rc11-consistency-on-pr.yml

permissions:
  contents: write

concurrency:
  group: rc11-consistency-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: agent/rc11-operational-center
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Apply and test consistency fixes
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_rc11_consistency.py
          python -m pip install -r requirements-dev.txt
          python -m ruff format app/main.py tests/test_operational_center.py
          python -m ruff check app/main.py tests/test_operational_center.py
          node --check app/static/operational-center.js
          python -m pytest -q tests/test_operational_center.py tests/test_operational_center_assets.py
          git diff --check
      - name: Commit tested non-workflow changes
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/apply_rc11_consistency.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.py app/static/operational-center.js tests/test_operational_center.py
          git commit -m "Keep RC11 corrected totals and report export consistent"
          git push origin HEAD:agent/rc11-operational-center
