name: Normalize RC10 Installer Once

on:
  push:
    branches:
      - agent/product-quality-pass
    paths:
      - .github/workflows/normalize-rc10-installer-once.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: agent/product-quality-pass
      - name: Preserve installer source line endings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("installer/windows/ThisTinti.iss")
          text = path.read_bytes().decode("utf-8").replace("\r\n", "\n").replace("\r", "\n")
          path.write_bytes(text.replace("\n", "\r\n").encode("utf-8"))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add installer/windows/ThisTinti.iss
          git commit -m "Preserve RC10 installer source line endings"
          git push origin HEAD:agent/product-quality-pass
