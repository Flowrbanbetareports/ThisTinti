name: One-shot dirty parser hardening v2

on:
  push:
    branches:
      - benchmark/dirty-public-corpus-22
    paths:
      - scripts/_fix_dirty_hardening_output.py
      - .github/workflows/one-shot-dirty-hardening-v2.yml

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: benchmark/dirty-public-corpus-22
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Apply conservative parser and evidence hardening
        run: |
          python scripts/_apply_dirty_parser_hardening.py
          python scripts/_fix_dirty_hardening_output.py
      - name: Format touched Python files
        run: |
          ruff format app/parsers/pdf_text.py scripts/run_dirty_public_corpus.py scripts/local_distribution_smoke.py tests/test_dirty_public_corpus.py tests/test_pdf_semantics.py
          ruff check app/parsers/pdf_text.py scripts/run_dirty_public_corpus.py scripts/local_distribution_smoke.py tests/test_dirty_public_corpus.py tests/test_pdf_semantics.py
      - name: Normalize trailing whitespace
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/run_dirty_public_corpus.py")
          text = path.read_text(encoding="utf-8")
          path.write_text(
              "\n".join(line.rstrip() for line in text.splitlines()) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Run focused semantic tests
        run: pytest -q tests/test_pdf_semantics.py tests/test_dirty_public_corpus.py
      - name: Remove one-shot machinery
        run: |
          rm scripts/_apply_dirty_parser_hardening.py
          rm scripts/_fix_dirty_hardening_output.py
          rm .github/workflows/one-shot-dirty-hardening.yml
          rm .github/workflows/one-shot-dirty-hardening-v2.yml
      - name: Commit hardened branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Harden raw PDF semantics and Windows OCR proof'
          git push origin HEAD:benchmark/dirty-public-corpus-22
