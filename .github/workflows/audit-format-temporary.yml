name: Temporary Audit Formatter

on:
  push:
    branches:
      - hardening/repository-audit-2026-08-27
    paths:
      - scripts/restore_backup.py
      - tests/test_dirty_public_semantic_evaluator.py
      - .github/workflows/audit-format-temporary.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: hardening/repository-audit-2026-08-27
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Format the two audit files with the repository formatter
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install ruff==0.15.22
          ruff format scripts/restore_backup.py tests/test_dirty_public_semantic_evaluator.py
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/restore_backup.py tests/test_dirty_public_semantic_evaluator.py
          git commit -m "Format repository audit fixes"
          git push origin HEAD:hardening/repository-audit-2026-08-27
