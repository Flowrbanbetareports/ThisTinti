name: Apply RC11 Quality on PR

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/apply_rc11_quality.py
      - scripts/check_operational_center_browser.py
      - app/static/operational-learning.js
      - app/static/operational-learning.css
      - tests/test_rules_presentation.py
      - .github/workflows/apply-rc11-quality-on-pr.yml

permissions:
  contents: write

concurrency:
  group: rc11-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: agent/rc11-operational-center
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Apply source formatting, loader and browser-gate changes
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_rc11_quality.py
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/check_operational_center_browser.py')
          text = path.read_text(encoding='utf-8')
          old = '<div id="caseDialogBody"></div><dialog id="caseDialog"></dialog>\n<div id="chainDialogBody"></div><dialog id="chainDialog"></dialog>\n<div id="documentDialogBody"><div class="lines-table">'
          new = '<dialog id="caseDialog"><div id="caseDialogBody"></div></dialog>\n<dialog id="chainDialog"><div id="chainDialogBody"></div></dialog>\n<dialog id="documentDialog"><div id="documentDialogBody"><div class="lines-table">'
          if text.count(old) != 1:
              raise SystemExit('Browser fixture dialog marker not found exactly once')
          text = text.replace(old, new, 1)
          text = text.replace('</div></div><dialog id="documentDialog"></dialog>\n<script>', '</div></div></dialog>\n<script>', 1)
          text = text.replace("async function openCase(id) { state.selectedCase = caseDetail; document.querySelector('#caseDialogBody').innerHTML=", "async function openCase(id) { state.selectedCase = caseDetail; document.querySelector('#caseDialog').showModal(); document.querySelector('#caseDialogBody').innerHTML=", 1)
          text = text.replace("async function openChain(id) { document.querySelector('#chainDialogBody').innerHTML=", "async function openChain(id) { document.querySelector('#chainDialog').showModal(); document.querySelector('#chainDialogBody').innerHTML=", 1)
          text = text.replace("async function openDocument(id) { state.selectedDocument = documentDetail; }", "async function openDocument(id) { state.selectedDocument = documentDetail; if (!document.querySelector('#documentDialog').open) document.querySelector('#documentDialog').showModal(); }", 1)
          path.write_text(text, encoding='utf-8')
          PY
          python -m pip install -r requirements-dev.txt
          pip install playwright==1.55.0
          python -m playwright install chromium
          python -m ruff format app/services/rules.py tests/test_rules_presentation.py scripts/check_operational_center_browser.py
          python -m ruff check app/services/rules.py tests/test_rules_presentation.py scripts/check_operational_center_browser.py
          node --check app/static/operational-center.js
          node --check app/static/operational-learning.js
          python -m pytest -q tests/test_rules_presentation.py tests/test_operational_center.py tests/test_operational_center_assets.py
          python scripts/check_operational_center_browser.py
          git diff --check
      - name: Commit tested quality changes and remove one-time helpers
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/apply_rc11_quality.py .github/workflows/apply-rc11-quality-on-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/services/rules.py \
            app/static/app.js \
            app/static/operational-learning.js \
            app/static/operational-learning.css \
            .github/workflows/simplified-experience.yml \
            scripts/check_operational_center_browser.py \
            tests/test_rules_presentation.py
          git commit -m "Complete the RC11 operational quality layer"
          git push origin HEAD:agent/rc11-operational-center
