name: Dirty Public Corpus 22

on:
  pull_request:
    paths:
      - samples/dirty_public_corpus_22.json
      - scripts/run_dirty_public_corpus.py
      - tests/test_dirty_public_corpus.py
      - docs/DIRTY_PUBLIC_CORPUS_22.md
      - docs/DIRTY_PUBLIC_CORPUS_22_*.md
      - .github/workflows/dirty-public-corpus-22.yml
      - app/parsers/**
  push:
    branches:
      - main
    paths:
      - samples/dirty_public_corpus_22.json
      - scripts/run_dirty_public_corpus.py
      - tests/test_dirty_public_corpus.py
      - docs/DIRTY_PUBLIC_CORPUS_22.md
      - docs/DIRTY_PUBLIC_CORPUS_22_*.md
      - .github/workflows/dirty-public-corpus-22.yml
      - app/parsers/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dirty-public-corpus-22-${{ github.ref }}
  cancel-in-progress: true

jobs:
  characterize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install local OCR runtime
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-ita
          tesseract --version
          tesseract --list-langs
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate corpus governance contract
        run: pytest -q tests/test_dirty_public_corpus.py
      - name: Run raw external corpus
        env:
          THISTINTI_OCR_ENABLED: "true"
          THISTINTI_OCR_LANGUAGES: "ita+eng"
        run: |
          mkdir -p builds
          python scripts/run_dirty_public_corpus.py \
            --manifest samples/dirty_public_corpus_22.json \
            --report builds/dirty-public-corpus-22-latest.json \
            --markdown builds/dirty-public-corpus-22-latest.md
      - name: Print characterization report
        if: always()
        run: |
          if [ -f builds/dirty-public-corpus-22-latest.md ]; then
            cat builds/dirty-public-corpus-22-latest.md
          else
            echo "dirty public corpus report was not produced"
          fi
      - name: Upload reproducible characterization evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dirty-public-corpus-22-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            builds/dirty-public-corpus-22-latest.json
            builds/dirty-public-corpus-22-latest.md
          retention-days: 30
