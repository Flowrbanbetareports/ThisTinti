name: One-shot semantic evaluator lint fix

on:
  push:
    branches:
      - benchmark/dirty-public-corpus-22
    paths:
      - scripts/_fix_semantic_evaluator_lint.py
      - .github/workflows/one-shot-semantic-evaluator-lint.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: benchmark/dirty-public-corpus-22
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Apply lint fix
        run: python scripts/_fix_semantic_evaluator_lint.py
      - name: Verify evaluator formatting and tests
        run: |
          python -m pip install -r requirements-dev.txt
          ruff format scripts/evaluate_dirty_public_semantics.py tests/test_dirty_public_semantic_evaluator.py
          ruff check scripts/evaluate_dirty_public_semantics.py tests/test_dirty_public_semantic_evaluator.py
          pytest -q tests/test_dirty_public_semantic_evaluator.py
      - name: Remove one-shot machinery
        run: |
          rm scripts/_fix_semantic_evaluator_lint.py
          rm .github/workflows/one-shot-semantic-evaluator-lint.yml
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix semantic evaluator quality gate'
          git push origin HEAD:benchmark/dirty-public-corpus-22
