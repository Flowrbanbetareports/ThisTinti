name: Apparel Pre-Pilot 30

on:
  push:
    branches:
      - main
    paths:
      - app/parsers/pdf_text.py
      - samples/pilot_apparel_30_synthetic.json
      - scripts/run_apparel_pilot.py
      - tests/test_apparel_pilot_dataset.py
      - tests/test_parsers.py
      - docs/APPAREL_PRE_PILOT_30.md
      - .github/workflows/apparel-pre-pilot-30.yml
  pull_request:
    paths:
      - app/parsers/pdf_text.py
      - samples/pilot_apparel_30_synthetic.json
      - scripts/run_apparel_pilot.py
      - tests/test_apparel_pilot_dataset.py
      - tests/test_parsers.py
      - docs/APPAREL_PRE_PILOT_30.md
      - .github/workflows/apparel-pre-pilot-30.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apparel-pre-pilot-30-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      THISTINTI_ENV: test
      THISTINTI_DATABASE_URL: sqlite:///./apparel-pre-pilot.db
      THISTINTI_SECRET_KEY: apparel-pre-pilot-secret-key-more-than-thirty-two-characters
      THISTINTI_AUTO_CREATE_SCHEMA: "false"
      THISTINTI_ALLOW_REGISTRATION: "true"
      THISTINTI_SECURE_COOKIES: "false"
      THISTINTI_OCR_ENABLED: "true"
      THISTINTI_STORAGE_DIR: ./apparel-pilot-data/uploads
      THISTINTI_QUARANTINE_DIR: ./apparel-pilot-data/quarantine
      THISTINTI_REJECTED_DIR: ./apparel-pilot-data/rejected
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install OCR tools and dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng tesseract-ocr-ita fonts-dejavu-core
          python -m pip install -r requirements-dev.txt
      - name: Prepare isolated database
        shell: bash
        run: |
          set -euo pipefail
          rm -f apparel-pre-pilot.db
          alembic upgrade head
      - name: Validate synthetic dataset governance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p builds
          python scripts/validate_pilot_dataset.py \
            samples/pilot_apparel_30_synthetic.json \
            --report builds/apparel-pre-pilot-30-inspection.json \
            --fail-on-warning
      - name: Run 30 practices and OCR diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_apparel_pilot.py \
            samples/pilot_apparel_30_synthetic.json \
            --report builds/apparel-pre-pilot-30-latest.json \
            --markdown builds/apparel-pre-pilot-30-latest.md \
            --measurement-template builds/apparel-real-pilot-measurements.csv
      - name: Require useful OCR rows for stable synthetic scans
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("builds/apparel-pre-pilot-30-latest.json").read_text(encoding="utf-8"))
          items = {item.get("variant"): item for item in report["scan_diagnostic"]["items"]}
          failures = []
          for variant in ("clear", "low-contrast"):
              item = items.get(variant)
              if not item:
                  failures.append(f"{variant}: result missing")
                  continue
              if item.get("outcome") in {"error", "parse_failed"}:
                  failures.append(f"{variant}: outcome={item.get('outcome')}")
              if item.get("parse_status") not in {"parsed", "review_required"}:
                  failures.append(f"{variant}: parse_status={item.get('parse_status')}")
              if int(item.get("line_count") or 0) < 1:
                  failures.append(f"{variant}: no product line extracted")
              if not item.get("number"):
                  failures.append(f"{variant}: invoice number missing")
          if failures:
              raise SystemExit("OCR regression gate failed: " + "; ".join(failures))
          print("OCR regression gate passed for clear and low-contrast scans")
          PY
      - name: Upload reproducible evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apparel-pre-pilot-30-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            builds/apparel-pre-pilot-30-inspection.json
            builds/apparel-pre-pilot-30-latest.json
            builds/apparel-pre-pilot-30-latest.md
            builds/apparel-real-pilot-measurements.csv
          retention-days: 30
      - name: Record latest benchmark evidence on main
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            builds/apparel-pre-pilot-30-inspection.json \
            builds/apparel-pre-pilot-30-latest.json \
            builds/apparel-pre-pilot-30-latest.md \
            builds/apparel-real-pilot-measurements.csv
          if git diff --cached --quiet; then
            echo "Benchmark evidence already current"
            exit 0
          fi
          git fetch origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "Main moved while the benchmark ran; evidence remains available as an artifact"
            exit 0
          fi
          git commit -m "Record current apparel pre-pilot evidence"
          git push origin HEAD:main
