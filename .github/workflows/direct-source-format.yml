name: Direct Source Format Probe

on:
  push:
    branches:
      - hardening/direct-source-facts-v1
    paths:
      - ".github/workflows/direct-source-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: hardening/direct-source-facts-v1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install canonical Ruff
        run: pip install ruff==0.15.22
      - name: Format direct-source changes
        run: ruff format app/parsers/structured_json.py app/services/ingestion.py
      - name: Commit canonical formatting to this branch only
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- app/parsers/structured_json.py app/services/ingestion.py && {
            echo "Files already canonical"
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/parsers/structured_json.py app/services/ingestion.py
          git commit -m "Provenance: format direct source changes"
          git push origin HEAD:hardening/direct-source-facts-v1
