name: Run RC11 Wiring on PR

on:
  pull_request:
    branches: [main]
    paths:
      - app/services/operational.py
      - app/static/operational-center.js
      - app/static/operational-center.css
      - tests/test_operational_center.py
      - tests/test_operational_center_assets.py
      - scripts/apply_rc11_wiring.py
      - .github/workflows/run-rc11-wiring-on-pr.yml

permissions:
  contents: write

concurrency:
  group: rc11-wiring-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  wire:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: agent/rc11-operational-center
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Apply wiring and verify vertical slice
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_rc11_wiring.py
          python -m pip install -r requirements-dev.txt
          python -m ruff format app/main.py app/schemas.py app/services/operational.py tests/test_operational_center.py tests/test_operational_center_assets.py
          python -m ruff check app/main.py app/schemas.py app/services/operational.py tests/test_operational_center.py tests/test_operational_center_assets.py
          python -m pytest -q tests/test_operational_center.py tests/test_operational_center_assets.py tests/test_auth.py tests/test_chain_comparison.py tests/test_chain_link_options.py
          git diff --check
      - name: Commit tested implementation and remove one-time helpers
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            scripts/apply_rc11_wiring.py \
            .github/workflows/apply-rc11-backend-once.yml \
            .github/workflows/run-rc11-wiring-on-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.py app/schemas.py app/static/app.js app/services/operational.py app/static/operational-center.js app/static/operational-center.css tests/test_operational_center.py tests/test_operational_center_assets.py
          git commit -m "Wire and verify the RC11 operational center"
          git push origin HEAD:agent/rc11-operational-center
