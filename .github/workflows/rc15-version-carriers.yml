name: RC15 Version Carrier Alignment

on:
  push:
    branches:
      - rc15/pilot-ready
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rc15-version-carriers
  cancel-in-progress: false

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Align RC15 version carriers
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          from datetime import datetime, timezone
          from pathlib import Path

          release = "3.4.0-alpha.7-rc.15"
          package = "3.4.0a7+rc.15"

          def replace_exact(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"Expected version carrier not found in {path}: {old}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_exact(
              "installer/windows/ThisTinti.iss",
              '#define MyAppVersion "3.4.0-alpha.7-rc.14"',
              f'#define MyAppVersion "{release}"',
          )
          replace_exact(
              "pyproject.toml",
              'version = "3.4.0a7+rc.14"',
              f'version = "{package}"',
          )

          readme = Path("README.md")
          readme_text = readme.read_text(encoding="utf-8")
          candidate_line = (
              f"Candidato in qualificazione: **{release} — RC15 Pilot-Ready**. "
              "Non è ancora una release pubblicata: RC14 resta la Public Preview corrente finché "
              "tutti i gate canonici non risultano verdi sul medesimo commit finale."
          )
          if release not in readme_text:
              anchor = "Release pubblica corrente: **3.4.0-alpha.7-rc.14 — Public Preview**.\n"
              if anchor not in readme_text:
                  raise SystemExit("README release anchor not found")
              readme_text = readme_text.replace(anchor, anchor + "\n" + candidate_line + "\n", 1)
              readme.write_text(readme_text, encoding="utf-8")

          notes = Path("RELEASE_NOTES.md")
          notes_text = notes.read_text(encoding="utf-8")
          if not notes_text.startswith(f"# {release}"):
              rc15_notes = f"""# {release} — Pilot-Ready — candidato in qualificazione, non pubblicato

- completa il workflow supervisionato di pratica per operatori non tecnici: intake, stati di acquisizione/revisione/blocco, correzione e rielaborazione, catena documentale ed evidenze consultabili;
- rende auditabile il ciclo di vita delle segnalazioni, incluso reopen, con motivazione obbligatoria per le decisioni umane conseguenti e separazione tra gravità tecnica, confidenza, esposizione potenziale e perdita confermata;
- integra il pilot workspace con autorizzazione, due riferimenti revisore, ground truth congelabile/versionata, hash di dataset/configurazione/applicazione e report redatto riproducibile;
- aggiunge profilo azienda v1 e ciclo di vita della pratica con configurazione versionata, export con manifest, archivio e cancellazione esplicita con tombstone non sensibile;
- espone attributi commerciali strutturati senza introdurre un motore decisionale LLM cloud o decisioni economiche autonome;
- allinea versione applicativa, pacchetto Python, installer Windows, OpenAPI, SBOM e registry dei gate al candidato RC15;
- RC14 resta l’ultima Public Preview pubblicata finché RC15 non supera tutti i gate canonici sul medesimo commit e la verifica successiva su `main`;
- i gate esterni reali restano deliberatamente aperti: pilot autorizzato, sicurezza indipendente, revisione legale/privacy/trademark, WCAG manuale, infrastruttura produttiva, firma Authenticode e onboarding con utenti non istruiti non vengono autocertificati dall’automazione.

"""
              notes.write_text(rc15_notes + notes_text, encoding="utf-8")

          registry_path = Path("docs/evidence/beta/external-gates.json")
          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          if registry.get("candidate_version") != release:
              registry["candidate_version"] = release
              registry["updated_at"] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
              registry_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          git diff --check
      - name: Commit aligned carriers when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- installer/windows/ThisTinti.iss pyproject.toml README.md RELEASE_NOTES.md docs/evidence/beta/external-gates.json; then
            echo "RC15 version carriers already aligned."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add installer/windows/ThisTinti.iss pyproject.toml README.md RELEASE_NOTES.md docs/evidence/beta/external-gates.json
          git commit -m "chore(rc15): align release version carriers"
          git push origin HEAD:rc15/pilot-ready
