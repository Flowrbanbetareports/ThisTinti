name: Format PR46 Python files

on:
  push:
    branches:
      - codex/rc6-recovery-center
    paths:
      - ".github/workflows/format-pr46.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: codex/rc6-recovery-center
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Format only the affected Python files
        run: |
          python -m pip install ruff==0.12.12
          ruff format app/main.py scripts/check_job_recovery_browser.py
      - name: Commit formatting-only changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.py scripts/check_job_recovery_browser.py
          git diff --cached --quiet && exit 0
          git commit -m "Format RC6 recovery center files"
          git push origin HEAD:codex/rc6-recovery-center
