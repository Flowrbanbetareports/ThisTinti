name: Real Pilot Toolkit

on:
  push:
    paths:
      - scripts/real_pilot_toolkit.py
      - tests/test_real_pilot_toolkit.py
      - samples/real_pilot_apparel_manifest_template.json
      - docs/REAL_PILOT_*.md
      - .github/workflows/real-pilot-toolkit.yml
  pull_request:
    paths:
      - scripts/real_pilot_toolkit.py
      - tests/test_real_pilot_toolkit.py
      - samples/real_pilot_apparel_manifest_template.json
      - docs/REAL_PILOT_*.md
      - .github/workflows/real-pilot-toolkit.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check formatting and lint
        run: |
          ruff format --check scripts/real_pilot_toolkit.py tests/test_real_pilot_toolkit.py
          ruff check scripts/real_pilot_toolkit.py tests/test_real_pilot_toolkit.py
      - name: Run toolkit tests
        run: pytest tests/test_real_pilot_toolkit.py
      - name: Exercise fail-closed workspace preparation and inspection
        run: |
          rm -rf /tmp/thistinti-real-pilot
          python scripts/real_pilot_toolkit.py prepare /tmp/thistinti-real-pilot \
            --pilot-id CI-APPAREL-001 \
            --organization-alias ORG-CI \
            --case-count 30
          if python scripts/real_pilot_toolkit.py inspect /tmp/thistinti-real-pilot; then
            echo "Fresh workspace unexpectedly passed readiness inspection" >&2
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("/tmp/thistinti-real-pilot/inspection.json").read_text(encoding="utf-8"))
          assert report["structure_valid"] is True
          assert report["ready_for_execution"] is False
          assert "autorizzazione non ancora approvata" in report["blocking_conditions"]
          assert "AUTHORIZATION.md non compilato e firmato" in report["blocking_conditions"]
          PY
