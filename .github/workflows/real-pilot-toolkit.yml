name: Real Pilot Toolkit

on:
  push:
    paths:
      - scripts/real_pilot_toolkit.py
      - tests/test_real_pilot_toolkit.py
      - samples/real_pilot_apparel_manifest_template.json
      - docs/REAL_PILOT_*.md
      - .github/workflows/real-pilot-toolkit.yml
  pull_request:
    paths:
      - scripts/real_pilot_toolkit.py
      - tests/test_real_pilot_toolkit.py
      - samples/real_pilot_apparel_manifest_template.json
      - docs/REAL_PILOT_*.md
      - .github/workflows/real-pilot-toolkit.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check formatting and lint
        run: |
          ruff format --check scripts/real_pilot_toolkit.py tests/test_real_pilot_toolkit.py
          ruff check scripts/real_pilot_toolkit.py tests/test_real_pilot_toolkit.py
      - name: Run toolkit tests
        run: pytest tests/test_real_pilot_toolkit.py
      - name: Exercise workspace preparation and inspection
        run: |
          python scripts/real_pilot_toolkit.py prepare /tmp/thistinti-real-pilot \
            --pilot-id CI-APPAREL-001 \
            --organization-alias ORG-CI \
            --case-count 30
          python scripts/real_pilot_toolkit.py inspect /tmp/thistinti-real-pilot
