name: Prepare RC13 generated metadata

on:
  push:
    branches:
      - security/rc13-pypdf
    paths:
      - .github/workflows/prepare-rc13-generated.yml

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: security/rc13-pypdf
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install locked development dependencies
        run: python -m pip install -r requirements-dev-linux.lock.txt

      - name: Align candidate documentation
        shell: python
        run: |
          from pathlib import Path

          version = "3.4.0-alpha.7-rc.13"
          public = "3.4.0-alpha.7-rc.12"

          notes = Path("RELEASE_NOTES.md")
          text = notes.read_text(encoding="utf-8")
          if not text.startswith(f"# {version}"):
              prefix = f'''# {version} — hotfix sicurezza PDF (candidata interna)\n\n- aggiorna `pypdf` da 6.14.2 a 6.15.0 per correggere `PYSEC-2026-3655` e `PYSEC-2026-3656`;\n- nessuna nuova funzionalità, nessuna modifica UI e nessun cambiamento al modello local-first;\n- rigenera lock e SBOM e richiede nuovamente dependency audit, test parser/PDF, CI completa e ciclo Windows sul commit candidato esatto;\n- `{public}` resta la Public Preview immutabile finché RC13 non supera tutti i gate e viene pubblicata separatamente;\n- pilot reale, pentest indipendente, revisione legale/privacy, WCAG manuale, utenti non istruiti e firma Authenticode restano gate esterni aperti.\n\n'''
              notes.write_text(prefix + text, encoding="utf-8")

          beta = Path("docs/BETA_READINESS_STATUS.md")
          text = beta.read_text(encoding="utf-8")
          old = f"ThisTinti `{public}` è la Public Preview pubblicata e immutabile corrente. La pubblicazione è registrata con tag, commit applicativo, checksum, provenienza e attestazioni; non equivale a una beta validata e non chiude alcun gate esterno. La base tecnica include:"
          new = f"ThisTinti è in preparazione interna come `{version}`, candidata di sicurezza limitata all'aggiornamento di `pypdf` 6.14.2 → 6.15.0. L'ultima Public Preview pubblicata e immutabile resta `{public}`. La nuova candidata non equivale a una beta validata e non chiude alcun gate esterno. La base tecnica include:"
          if old not in text:
              raise SystemExit("BETA_READINESS_STATUS expected RC12 state not found")
          beta.write_text(text.replace(old, new, 1), encoding="utf-8")

          roadmap = Path("ROADMAP.md")
          text = roadmap.read_text(encoding="utf-8")
          text = text.replace(
              f"## Stato attuale — {public} Public Preview",
              f"## Stato attuale — {version} candidata interna di sicurezza; {public} Public Preview",
              1,
          )
          marker = f"La Public Preview pubblica corrente è `{public}`, distribuita come release immutabile con checksum, provenienza e attestazioni."
          replacement = f"La candidata interna corrente è `{version}` e contiene esclusivamente la correzione pypdf 6.15.0 per due advisory emerse dal dependency audit. La Public Preview pubblica corrente resta `{public}`, distribuita come release immutabile con checksum, provenienza e attestazioni."
          if marker not in text:
              raise SystemExit("ROADMAP expected RC12 publication text not found")
          roadmap.write_text(text.replace(marker, replacement, 1), encoding="utf-8")

          headings = {
              "docs/OPERATIONS.md": f"# Manuale operativo — ThisTinti {version} (candidata interna non pubblicata)",
              "docs/PRODUCTION_READINESS.md": f"# Production readiness — ThisTinti {version} (candidata interna, non produzione)",
              "docs/THREAT_MODEL.md": f"# Threat model — ThisTinti {version} (candidata interna non pubblicata)",
          }
          for name, heading in headings.items():
              path = Path(name)
              lines = path.read_text(encoding="utf-8").splitlines()
              lines[0] = heading
              path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          Path("docs/RC13_SECURITY_CANDIDATE.md").write_text(f'''# RC13 — candidata interna di sicurezza\n\nVersione: `{version}`.\n\n## Motivo\n\nIl dependency audit online eseguito dopo la pubblicazione RC12 ha rilevato `PYSEC-2026-3655` e `PYSEC-2026-3656` su `pypdf` 6.14.2. Entrambi indicano 6.15.0 come versione corretta. Poiché ThisTinti analizza PDF non fidati, la dipendenza rientra nel perimetro reale di sicurezza e non viene ignorata o soppressa.\n\n## Perimetro\n\n- `pypdf` 6.14.2 → 6.15.0;\n- lock Linux e development riallineate;\n- SBOM e OpenAPI rigenerate con identità RC13;\n- nessuna nuova funzione o modifica UI;\n- nessun cambiamento a telemetria, cloud, account, pagamenti o automazioni economiche.\n\n## Promozione\n\nRC13 può essere pubblicata soltanto dopo CI completa, dependency audit verde, test PDF/parser, prove PostgreSQL/self-hosted, build e ciclo Windows sul commit esatto, checksum e provenienza. `{public}` resta immutabile fino a quella pubblicazione separata.\n\nI gate esterni di pilot reale, sicurezza indipendente, revisione legale/privacy/marchio, WCAG manuale, test con utenti non istruiti, infrastruttura definitiva e firma Authenticode restano aperti.\n''', encoding="utf-8")

      - name: Regenerate OpenAPI and SBOM
        run: |
          python scripts/generate_openapi.py
          python scripts/generate_sbom.py

      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/prepare-rc13-generated.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md ROADMAP.md RELEASE_NOTES.md docs app/version.py pyproject.toml installer/windows/ThisTinti.iss requirements.txt requirements-linux.lock.txt requirements-dev-linux.lock.txt
          git add -u .github/workflows/prepare-rc13-generated.yml
          git commit -m "Prepare RC13 pypdf security candidate metadata"
          git push origin HEAD:security/rc13-pypdf
