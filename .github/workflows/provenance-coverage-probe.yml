name: Provenance Coverage Probe

on:
  push:
    branches:
      - provenance/duplicate-number-finding-v0
    paths:
      - .github/workflows/provenance-coverage-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: provenance/duplicate-number-finding-v0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Apply exact v3 runtime patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/provenance-finding-one-shot-v3.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          payload = textwrap.dedent(workflow[start:end])
          exec(compile(payload, '<v3-runtime-patch>', 'exec'), {'__name__': '__main__'})
          PY
      - name: V3 syntax format static and targeted preflight
        env:
          THISTINTI_OCR_ENABLED: 'false'
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile app/services/rules.py tests/test_duplicate_number_finding_provenance.py
          python -m ruff format app/services/rules.py tests/test_duplicate_number_finding_provenance.py
          python -m ruff check app/services/rules.py tests/test_duplicate_number_finding_provenance.py
          python -m pytest -q tests/test_duplicate_number_finding_provenance.py
      - name: Exact release prelude and ordered coverage diagnosis
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d -t thistinti-verify-XXXXXX)"
          trap 'rm -rf "$TMP"' EXIT

          export THISTINTI_ENV=test
          export THISTINTI_DATABASE_URL="sqlite:///$TMP/verify.db"
          export THISTINTI_STORAGE_DIR="$TMP/uploads"
          export THISTINTI_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          export THISTINTI_AUTO_CREATE_SCHEMA=false
          export THISTINTI_ALLOW_REGISTRATION=true
          export THISTINTI_SECURE_COOKIES=false
          export COVERAGE_FILE="$TMP/.coverage"

          python -m ruff check app tests scripts migrations
          python -m ruff format --check app tests scripts migrations
          python -m bandit -q -r app scripts -x tests
          python -m compileall -q app scripts
          node --check app/static/app.js
          node --check site/site.js

          export PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
          mapfile -t TEST_FILES < <(find tests -maxdepth 1 -type f -name 'test_*.py' -print | sort)
          index=0
          for test_file in "${TEST_FILES[@]}"; do
            index=$((index + 1))
            if [[ "$test_file" == "tests/test_extended.py" ]]; then
              echo "===== verbose diagnostic at module ${index}: ${test_file} ====="
              COVERAGE_FILE="$TMP/.coverage.extended-diagnostic" python -m coverage run --source=app -m pytest -vv -x --disable-warnings "$test_file"
              exit $?
            fi
            echo "[release prelude ${index}] ${test_file}"
            timeout 120s python scripts/coverage_pytest_module.py "$test_file"
          done
          echo "tests/test_extended.py not found"
          exit 2
