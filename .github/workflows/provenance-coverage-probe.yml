name: Provenance Coverage Probe

on:
  push:
    branches:
      - provenance/duplicate-number-finding-v0
    paths:
      - .github/workflows/provenance-coverage-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: provenance/duplicate-number-finding-v0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Apply exact v3 runtime patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/provenance-finding-one-shot-v3.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          payload = textwrap.dedent(workflow[start:end])
          exec(compile(payload, '<v3-runtime-patch>', 'exec'), {'__name__': '__main__'})
          PY
      - name: Verify patch syntax
        run: python -m py_compile app/services/rules.py
      - name: Repeat v3 targeted preflight
        env:
          THISTINTI_OCR_ENABLED: 'false'
        run: python -m pytest -q tests/test_duplicate_number_finding_provenance.py
      - name: Reproduce canonical module order before extended
        env:
          THISTINTI_OCR_ENABLED: 'false'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        shell: bash
        run: |
          set -euo pipefail
          rm -f .coverage .coverage.*
          mapfile -t TEST_FILES < <(find tests -maxdepth 1 -type f -name 'test_*.py' -print | sort)
          found=0
          index=0
          for test_file in "${TEST_FILES[@]}"; do
            if [[ "$test_file" == "tests/test_extended.py" ]]; then
              found=1
              break
            fi
            index=$((index + 1))
            echo "[prelude ${index}] ${test_file}"
            timeout 120s python scripts/coverage_pytest_module.py "$test_file"
          done
          [[ "$found" -eq 1 ]] || { echo "tests/test_extended.py not found"; exit 2; }
          echo "===== workspace before extended ====="
          git status --short
          find tests/.runtime -maxdepth 3 -type f -print 2>/dev/null | sort || true
          echo "===== exact canonical runner for extended ====="
          set +e
          timeout 120s python scripts/coverage_pytest_module.py tests/test_extended.py
          canonical_rc=$?
          set -e
          echo "canonical extended rc=${canonical_rc}"
          if [[ "$canonical_rc" -ne 0 ]]; then
            echo "===== diagnostic verbose rerun ====="
            COVERAGE_FILE=.coverage.extended-diagnostic python -m coverage run --source=app -m pytest -vv -x --disable-warnings tests/test_extended.py
            exit "$canonical_rc"
          fi
