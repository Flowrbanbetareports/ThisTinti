name: Provenance Coverage Probe

on:
  push:
    branches:
      - provenance/duplicate-number-finding-v0
    paths:
      - .github/workflows/provenance-coverage-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: provenance/duplicate-number-finding-v0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Apply exact v3 runtime patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/provenance-finding-one-shot-v3.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          payload = textwrap.dedent(workflow[start:end])
          exec(compile(payload, '<v3-runtime-patch>', 'exec'), {'__name__': '__main__'})
          PY
      - name: Format exactly as v3
        run: |
          python -m ruff format app/services/rules.py tests/test_duplicate_number_finding_provenance.py
          python -m ruff check app/services/rules.py tests/test_duplicate_number_finding_provenance.py
      - name: Reproduce verify_release environment with verbose extended test
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d -t thistinti-probe-XXXXXX)"
          trap 'rm -rf "$TMP"' EXIT
          export THISTINTI_ENV=test
          export THISTINTI_DATABASE_URL="sqlite:///$TMP/verify.db"
          export THISTINTI_STORAGE_DIR="$TMP/uploads"
          export THISTINTI_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          export THISTINTI_AUTO_CREATE_SCHEMA=false
          export THISTINTI_ALLOW_REGISTRATION=true
          export THISTINTI_SECURE_COOKIES=false
          export COVERAGE_FILE="$TMP/.coverage"
          export PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
          export THISTINTI_OCR_ENABLED=false
          python -m pytest -vv -x --disable-warnings tests/test_extended.py
