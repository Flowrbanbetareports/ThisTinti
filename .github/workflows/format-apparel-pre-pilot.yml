name: Format Apparel Pre-Pilot

on:
  push:
    branches:
      - agent/apparel-pilot-30
    paths:
      - .github/workflows/format-apparel-pre-pilot.yml
  pull_request:
    paths:
      - .github/workflows/format-apparel-pre-pilot.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: agent/apparel-pilot-30
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Apply repository formatting
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install ruff==0.15.22
          ruff format scripts/run_apparel_pilot.py tests/test_apparel_pilot_dataset.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run_apparel_pilot.py tests/test_apparel_pilot_dataset.py
          if git diff --cached --quiet; then
            echo "Formatting already current"
          else
            git commit -m "Format apparel pre-pilot implementation"
            git push origin HEAD:agent/apparel-pilot-30
          fi
