name: RC15 Format Retry Test

on:
  push:
    branches:
      - rc15/pilot-ready
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rc15-format-retry-test
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: rc15/pilot-ready
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Format the RC15 retry test with the repository formatter
        run: |
          python -m pip install ruff==0.15.22
          ruff format tests/test_rc15_retry_and_errors.py
          ruff format --check tests/test_rc15_retry_and_errors.py
      - name: Commit formatting when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- tests/test_rc15_retry_and_errors.py; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_rc15_retry_and_errors.py
          git commit -m "style(rc15): format retry coverage tests"
          git push origin HEAD:rc15/pilot-ready
