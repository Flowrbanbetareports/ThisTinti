name: Apply RC6 Recovery Center Patch

on:
  push:
    branches:
      - codex/rc6-recovery-center
    paths:
      - ".automation/rc6-recovery.patch.gz.b64.part*"
      - ".github/workflows/apply-rc6-recovery.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: codex/rc6-recovery-center
          fetch-depth: 0
      - name: Reassemble and apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          cat .automation/rc6-recovery.patch.gz.b64.part* | base64 -d | gzip -d > /tmp/rc6-recovery.patch
          git apply --whitespace=fix /tmp/rc6-recovery.patch
          git diff --check
      - name: Commit product and regression changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/main.py \
            app/schemas.py \
            app/services/jobs.py \
            app/static/app-core.js \
            app/static/index.html \
            app/static/onboarding.js \
            app/static/styles-original.css \
            docs/USER_GUIDE_SIMPLE.md \
            docs/openapi.json \
            scripts/check_job_recovery_browser.py \
            tests/test_job_recovery.py \
            tests/test_simplified_experience.py
          git diff --cached --quiet && exit 0
          git commit -m "Add RC6 recovery center and guided reprocessing"
          git push origin HEAD:codex/rc6-recovery-center
