name: Provenance Finding One-Shot v3

on:
  push:
    branches:
      - provenance/duplicate-number-finding-v0
    paths:
      - .github/workflows/provenance-finding-one-shot-v3.yml

permissions:
  contents: write

jobs:
  qualify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: provenance/duplicate-number-finding-v0
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply thin rules integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/services/rules.py")
          text = path.read_text(encoding="utf-8")

          import_anchor = """from .line_matching import group_chain_lines\nfrom .normalizer import normalize_text\n"""
          import_replacement = """from .finding_provenance import record_duplicate_number_finding_provenance\nfrom .line_matching import group_chain_lines\nfrom .normalizer import normalize_text\n"""
          if text.count(import_anchor) != 1:
              raise SystemExit("import anchor mismatch")
          text = text.replace(import_anchor, import_replacement, 1)

          persistence_anchor = """        for evidence in finding.evidence:\n            db.add(EvidenceLink(tenant_id=chain.tenant_id, case_id=case.id, **evidence))\n        output.append(case)\n"""
          persistence_replacement = """        for evidence in finding.evidence:\n            db.add(EvidenceLink(tenant_id=chain.tenant_id, case_id=case.id, **evidence))\n        record_duplicate_number_finding_provenance(\n            db,\n            chain=chain,\n            case=case,\n            finding_case_type=finding.case_type,\n            finding_key=finding.key,\n            all_documents=all_documents,\n        )\n        output.append(case)\n"""
          if text.count(persistence_anchor) != 1:
              raise SystemExit("persistence anchor mismatch")
          text = text.replace(persistence_anchor, persistence_replacement, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Install canonical document tools and dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y openssl poppler-utils tesseract-ocr tesseract-ocr-eng tesseract-ocr-ita
          pip install -r requirements-dev.txt
      - name: Static and architecture checks
        shell: bash
        run: |
          python -m py_compile app/services/rules.py app/services/finding_provenance.py tests/test_duplicate_number_finding_provenance.py
          python -m ruff format app/services/rules.py app/services/finding_provenance.py tests/test_duplicate_number_finding_provenance.py
          python -m ruff check app/services/rules.py app/services/finding_provenance.py tests/test_duplicate_number_finding_provenance.py
          python scripts/check_module_boundaries.py
      - name: Targeted provenance tests
        env:
          THISTINTI_OCR_ENABLED: 'false'
        run: python -m pytest -q tests/test_duplicate_number_finding_provenance.py tests/test_module_boundaries.py
      - name: Prepare final repository tree for qualification
        shell: bash
        run: |
          rm -f .github/workflows/provenance-finding-one-shot.yml
          rm -f .github/workflows/provenance-finding-one-shot-v2.yml
          rm -f .github/workflows/provenance-finding-one-shot-v3.yml
          rm -f .github/workflows/provenance-coverage-probe.yml
          git diff --check
          if grep -R -n -E '^\s*git\s+push\b' .github/workflows/*.yml; then
            echo "Final workflow tree still contains direct repository pushes" >&2
            exit 1
          fi
      - name: Canonical release gate on final tree
        shell: bash
        run: |
          set -o pipefail
          make verify 2>&1 | tee provenance-finding-qualification.log
      - name: Commit qualified final tree
        shell: bash
        run: |
          git config user.name "ThisTinti"
          git config user.email "flowrbanbetareports@gmail.com"
          git add app/services/rules.py .github/workflows/provenance-finding-one-shot.yml .github/workflows/provenance-finding-one-shot-v2.yml .github/workflows/provenance-finding-one-shot-v3.yml .github/workflows/provenance-coverage-probe.yml
          git diff --cached --check
          git commit -m "provenance: link duplicate-number finding to facts"
          git push origin HEAD:provenance/duplicate-number-finding-v0
