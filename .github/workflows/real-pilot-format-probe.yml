name: Real Pilot Format Probe

on:
  push:
    paths:
      - ".github/workflows/real-pilot-format-probe.yml"
      - "scripts/real_pilot_toolkit.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install canonical Ruff
        run: python -m pip install ruff==0.15.22
      - name: Print canonical formatting diff
        shell: bash
        run: |
          ruff format scripts/real_pilot_toolkit.py
          git diff -- scripts/real_pilot_toolkit.py
