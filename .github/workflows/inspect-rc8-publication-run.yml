name: Inspect RC8 Publication Run

on:
  push:
    branches:
      - agent/close-rc8-publication-record
    paths:
      - .github/workflows/inspect-rc8-publication-run.yml

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: agent/close-rc8-publication-record
      - name: Capture formatter status
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/format-publication-control-test.yml/runs?per_page=10" > builds/formatter-run-status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builds/formatter-run-status.json
          git commit -m "Capture publication formatter workflow status"
          git push origin HEAD:agent/close-rc8-publication-record
