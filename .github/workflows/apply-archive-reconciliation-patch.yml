name: Apply archive reconciliation patch

on:
  push:
    branches:
      - fix/p1-archive-reconciliation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p1-archive-reconciliation
          fetch-depth: 0
      - name: Apply lifecycle reconciliation patch
        run: |
          python - <<'PY'
          from pathlib import Path

          api = Path('app/api.py')
          text = api.read_text()
          old = '''    document.archived = True\n    add_audit(db, ctx.tenant_id, "document.archived", ctx.user_id, "document", document.id)\n    db.commit()\n    return {"ok": True}\n'''
          new = '''    document.archived = True\n    affected_chain_ids = list(\n        db.scalars(\n            select(ChainDocument.chain_id)\n            .where(\n                ChainDocument.tenant_id == ctx.tenant_id,\n                ChainDocument.document_id == document.id,\n            )\n            .distinct()\n        )\n    )\n    for chain_id in affected_chain_ids:\n        chain = db.scalar(\n            select(OperationChain).where(\n                OperationChain.id == chain_id,\n                OperationChain.tenant_id == ctx.tenant_id,\n            )\n        )\n        if chain:\n            analyze_chain(db, chain)\n    add_audit(\n        db,\n        ctx.tenant_id,\n        "document.archived",\n        ctx.user_id,\n        "document",\n        document.id,\n        {"affected_chains": len(affected_chain_ids)},\n    )\n    db.commit()\n    return {"ok": True, "affected_chains": len(affected_chain_ids)}\n'''
          if old not in text:
              raise SystemExit('archive endpoint shape changed; refusing to patch stale source')
          api.write_text(text.replace(old, new, 1))

          test = Path('tests/test_api_archive_reconciliation.py')
          test.write_text('''from __future__ import annotations\n\nfrom sqlalchemy import select\n\nimport app.api as api_module\nfrom app.db import SessionLocal\nfrom app.models import ChainDocument\n\n\ndef test_public_archive_reconciles_exactly_affected_chains(client, auth, monkeypatch):\n    loaded = client.post("/api/demo/load", headers=auth)\n    assert loaded.status_code == 200, loaded.text\n\n    documents = client.get("/api/documents?limit=100", headers=auth).json()\n    document_id = None\n    expected_chain_ids: set[str] = set()\n    with SessionLocal() as db:\n        for document in documents:\n            chain_ids = set(\n                db.scalars(\n                    select(ChainDocument.chain_id).where(\n                        ChainDocument.tenant_id == document["tenant_id"]\n                        if "tenant_id" in document\n                        else ChainDocument.tenant_id.is_not(None),\n                        ChainDocument.document_id == document["id"],\n                    )\n                )\n            )\n            if chain_ids:\n                document_id = document["id"]\n                expected_chain_ids = chain_ids\n                break\n\n    assert document_id is not None\n    assert expected_chain_ids\n\n    called: list[str] = []\n    original_analyze_chain = api_module.analyze_chain\n\n    def recording_analyze_chain(db, chain):\n        called.append(chain.id)\n        return original_analyze_chain(db, chain)\n\n    monkeypatch.setattr(api_module, "analyze_chain", recording_analyze_chain)\n    archived = client.post(f"/api/documents/{document_id}/archive", headers=auth)\n    assert archived.status_code == 200, archived.text\n    assert archived.json()["affected_chains"] == len(expected_chain_ids)\n    assert set(called) == expected_chain_ids\n''')

          Path('.github/workflows/apply-archive-reconciliation-patch.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "ThisTinti Qualification Bot"
          git config user.email "flowrbanbetareports@gmail.com"
          git add app/api.py tests/test_api_archive_reconciliation.py .github/workflows/apply-archive-reconciliation-patch.yml
          git commit -m "fix: reconcile chains when documents are archived"
          git push origin HEAD:fix/p1-archive-reconciliation
