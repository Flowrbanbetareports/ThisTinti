name: Prepare RC9 Internal Candidate Once

on:
  push:
    branches:
      - agent/next-unreleased-rc9
    paths:
      - .github/workflows/prepare-rc9-once.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      THISTINTI_ENV: test
      THISTINTI_DATABASE_URL: sqlite:///./rc9-metadata.db
      THISTINTI_SECRET_KEY: rc9-internal-candidate-secret-more-than-thirty-two-characters
      THISTINTI_AUTO_CREATE_SCHEMA: "false"
      THISTINTI_ALLOW_REGISTRATION: "true"
      THISTINTI_SECURE_COOKIES: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: agent/next-unreleased-rc9
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements-dev.txt
      - name: Apply coherent unreleased version identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          old = "3.4.0-alpha.7-rc.8"
          new = "3.4.0-alpha.7-rc.9"
          replacements = {
              "app/version.py": [(f'RELEASE_VERSION = "{old}"', f'RELEASE_VERSION = "{new}"')],
              "pyproject.toml": [('version = "3.4.0a7+rc.8"', 'version = "3.4.0a7+rc.9"')],
              "app/static/app.js": [(f"UI_VERSION = '{old}'", f"UI_VERSION = '{new}'")],
              "tests/test_rebrand.py": [(f'RELEASE_VERSION == "{old}"', f'RELEASE_VERSION == "{new}"')],
              "tests/test_simplified_experience.py": [(f"UI_VERSION = '{old}'", f"UI_VERSION = '{new}'")],
              "installer/windows/ThisTinti.iss": [
                  (f'#define MyAppVersion "{old}"', f'#define MyAppVersion "{new}"'),
                  ("VersionInfoVersion=3.4.0.14", "VersionInfoVersion=3.4.0.15"),
              ],
              "docs/OPERATIONS.md": [
                  (f"# Manuale operativo — ThisTinti {old}", f"# Manuale operativo — ThisTinti {new} (candidata interna non pubblicata)")
              ],
              "docs/PRODUCTION_READINESS.md": [
                  (f"# Production readiness — ThisTinti {old}", f"# Production readiness — ThisTinti {new} (candidata interna non pubblicata)")
              ],
              "docs/THREAT_MODEL.md": [
                  (f"# Threat model — ThisTinti {old}", f"# Threat model — ThisTinti {new} (candidata interna non pubblicata)")
              ],
          }
          for name, pairs in replacements.items():
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              for source, target in pairs:
                  if text.count(source) != 1:
                      raise SystemExit(f"{name}: expected one occurrence of {source!r}, found {text.count(source)}")
                  text = text.replace(source, target, 1)
              path.write_text(text, encoding="utf-8")

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          source = f"Versione: **{old} — Public Preview con diagnostica locale integrata**."
          target = (
              f"Versione di sviluppo: **{new} — candidata interna non pubblicata**.\n\n"
              f"Ultima versione pubblica immutabile: **{old} — Public Preview**. "
              "La candidata interna aggiunge estrazione prudente delle righe da PDF OCR etichettati, "
              "controllo tra totale sorgente e totale ricalcolato e workflow pilot esclusivamente locale."
          )
          if text.count(source) != 1:
              raise SystemExit("README release identity not found exactly once")
          readme.write_text(text.replace(source, target, 1), encoding="utf-8")

          notes = Path("RELEASE_NOTES.md")
          text = notes.read_text(encoding="utf-8")
          if not text.startswith(f"# {old}"):
              raise SystemExit("Unexpected RELEASE_NOTES heading")
          intro = f"""# {new} — OCR strutturato e pilot esclusivamente locale (non pubblicata)\n\n- le fatture PDF con campi etichettati possono produrre righe revisionabili da SKU, descrizione, quantità, prezzo unitario, sconto e totale;\n- fornitore, riferimento ordine e riferimento consegna vengono acquisiti soltanto quando esplicitamente indicati;\n- i valori numerici OCR non validi restano fail-closed e riportano riga, campo, valore e motivo;\n- il totale indicato nel documento viene confrontato con quello ricalcolato, con revisione obbligatoria in caso di differenza;\n- le righe derivate da OCR mantengono provenienza e confidenza prudente e non diventano decisioni automatiche;\n- il benchmark abbigliamento blocca regressioni se le scansioni sintetiche pulite o a basso contrasto non producono almeno una riga utile;\n- il toolkit per pilot reale resta locale e non contiene invio email, contatti automatici o azioni verso fornitori;\n- questa è un’identità di sviluppo interna: nessun asset RC8 viene sostituito e nessuna RC9 viene pubblicata automaticamente.\n\n"""
          notes.write_text(intro + text, encoding="utf-8")

          roadmap = Path("ROADMAP.md")
          text = roadmap.read_text(encoding="utf-8")
          source = f"## Stato attuale — {old} Public Preview"
          target = f"## Stato attuale — {new} candidata interna non pubblicata\n\nUltima Public Preview pubblicata e immutabile: `{old}`."
          if text.count(source) != 1:
              raise SystemExit("ROADMAP current-state heading not found exactly once")
          text = text.replace(source, target, 1)
          marker = "- diagnostica locale integrata, senza PowerShell, con verbale scaricabile e test numerico tramite il normale upload.\n"
          addition = marker + (
              "- estrazione prudente di righe da PDF OCR con campi etichettati e provenienza verificabile;\n"
              "- confronto bloccante tra totale sorgente e totale ricalcolato;\n"
              "- benchmark OCR obbligatorio per scansioni sintetiche pulite e a basso contrasto;\n"
              "- workflow del pilot mantenuto interamente locale, senza contatti o messaggi automatici.\n"
          )
          if text.count(marker) != 1:
              raise SystemExit("ROADMAP feature marker not found exactly once")
          roadmap.write_text(text.replace(marker, addition, 1), encoding="utf-8")

          beta = Path("docs/BETA_READINESS_STATUS.md")
          text = beta.read_text(encoding="utf-8")
          source = f"ThisTinti è in preparazione come `{old}`. La base tecnica include:"
          target = (
              f"ThisTinti è in preparazione interna come `{new}`, non ancora pubblicata. "
              f"L’ultima Public Preview resta `{old}`. La base tecnica include:"
          )
          if text.count(source) != 1:
              raise SystemExit("Beta readiness version sentence not found exactly once")
          text = text.replace(source, target, 1)
          marker = "- diagnostica locale in-app con esiti non ambigui, test numerico reale e verbale JSON scaricabile.\n"
          addition = marker + (
              "- estrazione OCR prudente di righe etichettate, con valori numerici fail-closed e confronto dei totali;\n"
              "- gate sintetico bloccante su scansioni pulite e a basso contrasto;\n"
              "- toolkit pilot locale senza comunicazioni o azioni esterne automatiche.\n"
          )
          if text.count(marker) != 1:
              raise SystemExit("Beta readiness feature marker not found exactly once")
          beta.write_text(text.replace(marker, addition, 1), encoding="utf-8")

          gates = Path("docs/evidence/beta/external-gates.json")
          payload = json.loads(gates.read_text(encoding="utf-8"))
          if payload.get("candidate_version") != old:
              raise SystemExit("Unexpected external-gates candidate version")
          payload["candidate_version"] = new
          gates.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          Path("docs/RC9_INTERNAL_CANDIDATE.md").write_text(
              f"""# RC9 internal candidate\n\nVersion: `{new}`.\n\nThis identity is reserved for internal development after the immutable `{old}` Public Preview. It contains the OCR labelled-line improvement and product-only pilot workflow. It is not a published release, does not replace RC8 assets and must not trigger the public-preview publication workflow.\n\n## Required gates\n\n- complete repository verification;\n- PostgreSQL and self-hosted proofs;\n- apparel OCR benchmark;\n- Windows build, upgrade, installed diagnostics, uninstall and data-preservation lifecycle;\n- no mutation of `builds/public-preview-request.json`, RC8 release records or GitHub release assets.\n""",
              encoding="utf-8",
          )
          PY
          python scripts/generate_openapi.py
          python scripts/generate_sbom.py
          python -m ruff format app tests scripts migrations run_thistinti.py
          python scripts/check_release_consistency.py
          python -m pytest -q tests/test_rebrand.py tests/test_simplified_experience.py tests/test_parsers.py
          python -m ruff check app tests scripts migrations run_thistinti.py
          git diff --check
      - name: Commit the single coherent candidate update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/version.py \
            app/static/app.js \
            pyproject.toml \
            installer/windows/ThisTinti.iss \
            tests/test_rebrand.py \
            tests/test_simplified_experience.py \
            README.md \
            RELEASE_NOTES.md \
            ROADMAP.md \
            docs/BETA_READINESS_STATUS.md \
            docs/OPERATIONS.md \
            docs/PRODUCTION_READINESS.md \
            docs/THREAT_MODEL.md \
            docs/evidence/beta/external-gates.json \
            docs/openapi.json \
            docs/sbom.cdx.json \
            docs/RC9_INTERNAL_CANDIDATE.md
          git commit -m "Set the next internal candidate to RC9"
          git push origin HEAD:agent/next-unreleased-rc9
