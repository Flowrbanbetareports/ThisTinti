name: Provenance Format One-Shot

on:
  push:
    paths:
      - .github/workflows/provenance-format-one-shot.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Format exact provenance files
        run: |
          pip install ruff==0.15.22
          ruff format \
            app/provenance_models.py \
            migrations/versions/f31b0d7c6a52_add_provenance_persistence_v0.py \
            tests/test_local_schema.py
          ruff format --check \
            app/provenance_models.py \
            migrations/versions/f31b0d7c6a52_add_provenance_persistence_v0.py \
            tests/test_local_schema.py
      - name: Commit mechanical formatting
        run: |
          if git diff --quiet -- \
            app/provenance_models.py \
            migrations/versions/f31b0d7c6a52_add_provenance_persistence_v0.py \
            tests/test_local_schema.py; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/provenance_models.py \
            migrations/versions/f31b0d7c6a52_add_provenance_persistence_v0.py \
            tests/test_local_schema.py
          git commit -m "style: format provenance persistence"
          git push origin HEAD:main
