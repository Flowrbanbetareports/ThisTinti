name: Judgment Provenance Probe

on:
  push:
    branches:
      - provenance/finding-judgment-v0
    paths:
      - .github/workflows/judgment-provenance-probe.yml

permissions:
  contents: read

jobs:
  patch-test-emit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: provenance/finding-judgment-v0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Apply judgment integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/services/rc15.py")
          text = path.read_text(encoding="utf-8")

          import_anchor = "from .ingestion import document_parse_error_detail\n"
          import_replacement = (
              "from .ingestion import document_parse_error_detail\n"
              "from .judgment_provenance import record_judgment_provenance, resolve_reviewer_identity\n"
          )
          if text.count(import_anchor) != 1:
              raise SystemExit("judgment import anchor mismatch")
          text = text.replace(import_anchor, import_replacement, 1)

          transition_anchor = '''def transition_case(
              db: Session,
              tenant_id: str,
              user_id: str | None,
              case_id: str,
              action: str,
              note: str,
          ) -> DiscrepancyCase:
              item = db.scalar(
                  select(DiscrepancyCase).where(DiscrepancyCase.id == case_id, DiscrepancyCase.tenant_id == tenant_id)
              )
              if item is None:
                  raise LookupError("Segnalazione non trovata")
              normalized_note = note.strip()
              if len(normalized_note) < 3:
                  raise ValueError("Una motivazione di almeno 3 caratteri è obbligatoria")
              target = "needs_review" if action == "reopen" else action
              if target not in {"needs_review", "confirmed", "dismissed", "resolved"}:
                  raise ValueError("Transizione non valida")
              previous = item.status
              if target == previous:
                  raise ValueError("La segnalazione è già nello stato richiesto")
              if target not in CASE_TRANSITIONS.get(previous, set()):
                  raise ValueError(f"Transizione non consentita: {previous} → {target}")
              item.status = target
              db.add(
                  ReviewDecision(
                      tenant_id=tenant_id,
                      case_id=item.id,
                      user_id=user_id,
                      decision=target,
                      note=normalized_note,
                  )
              )
              add_audit(
                  db,
                  tenant_id,
                  "case.reopened" if action == "reopen" else "case.transitioned",
                  user_id,
                  "discrepancy_case",
                  item.id,
                  {"from": previous, "to": target, "reason": normalized_note},
              )
              db.flush()
              return item
          '''
          transition_replacement = '''def transition_case(
              db: Session,
              tenant_id: str,
              user_id: str | None,
              case_id: str,
              action: str,
              note: str,
          ) -> DiscrepancyCase:
              item = db.scalar(
                  select(DiscrepancyCase).where(DiscrepancyCase.id == case_id, DiscrepancyCase.tenant_id == tenant_id)
              )
              if item is None:
                  raise LookupError("Segnalazione non trovata")
              normalized_note = note.strip()
              if len(normalized_note) < 3:
                  raise ValueError("Una motivazione di almeno 3 caratteri è obbligatoria")
              target = "needs_review" if action == "reopen" else action
              if target not in {"needs_review", "confirmed", "dismissed", "resolved"}:
                  raise ValueError("Transizione non valida")
              previous = item.status
              if target == previous:
                  raise ValueError("La segnalazione è già nello stato richiesto")
              if target not in CASE_TRANSITIONS.get(previous, set()):
                  raise ValueError(f"Transizione non consentita: {previous} → {target}")

              reviewer_ref, reviewer_user_id = resolve_reviewer_identity(
                  db,
                  tenant_id=tenant_id,
                  actor_id=user_id,
              )
              item.status = target
              decision = ReviewDecision(
                  tenant_id=tenant_id,
                  case_id=item.id,
                  user_id=reviewer_user_id,
                  decision=target,
                  note=normalized_note,
              )
              db.add(decision)
              db.flush()
              record_judgment_provenance(
                  db,
                  tenant_id=tenant_id,
                  case_id=item.id,
                  review_decision=decision,
                  reviewer_ref=reviewer_ref,
                  reviewer_user_id=reviewer_user_id,
                  previous_state=previous,
              )
              add_audit(
                  db,
                  tenant_id,
                  "case.reopened" if action == "reopen" else "case.transitioned",
                  user_id,
                  "discrepancy_case",
                  item.id,
                  {"from": previous, "to": target, "reason": normalized_note},
              )
              db.flush()
              return item
          '''
          if text.count(transition_anchor) != 1:
              raise SystemExit("transition anchor mismatch")
          text = text.replace(transition_anchor, transition_replacement, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Format and static checks
        shell: bash
        run: |
          python -m py_compile app/services/rc15.py app/services/judgment_provenance.py tests/test_finding_judgment_provenance.py
          python -m ruff format app/services/rc15.py app/services/judgment_provenance.py tests/test_finding_judgment_provenance.py
          python -m ruff check app/services/rc15.py app/services/judgment_provenance.py tests/test_finding_judgment_provenance.py
          python scripts/check_module_boundaries.py
      - name: Targeted judgment tests
        env:
          THISTINTI_OCR_ENABLED: 'false'
        run: >-
          python -m pytest -q
          tests/test_finding_judgment_provenance.py
          tests/test_duplicate_number_finding_provenance.py
          tests/test_rc15_full_workflow.py
          tests/test_api_credentials.py
          tests/test_module_boundaries.py
      - name: Emit exact qualified files
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          for filename in (
              "app/services/rc15.py",
              "app/services/judgment_provenance.py",
              "tests/test_finding_judgment_provenance.py",
          ):
              encoded = base64.b64encode(Path(filename).read_bytes()).decode("ascii")
              marker = filename.replace("/", "_").replace(".", "_").upper()
              print(f"QUALIFIED_{marker}_B64_BEGIN")
              print(encoded)
              print(f"QUALIFIED_{marker}_B64_END")
          PY
