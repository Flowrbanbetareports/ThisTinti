name: Format RC8 Publication Recovery

on:
  push:
    branches:
      - agent/close-rc8-publication-record

permissions:
  contents: write

concurrency:
  group: format-rc8-publication-recovery
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: agent/close-rc8-publication-record
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Apply repository formatter
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install ruff==0.15.22
          ruff format scripts/record_github_publication.py tests/test_publication_evidence_recovery.py
          if git diff --quiet; then
            echo "Formatting already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/record_github_publication.py tests/test_publication_evidence_recovery.py
          git commit -m "Format RC8 publication recovery"
          git push origin HEAD:agent/close-rc8-publication-record
