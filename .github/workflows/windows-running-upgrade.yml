name: Windows Running Upgrade Proof

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-running-upgrade.yml"
      - "installer/windows/**"
      - "tests/test_windows_running_upgrade.py"
      - "builds/windows-upgrade-baseline.json"
      - "app/version.py"
      - "requirements*.txt"
      - "scripts/local_distribution_smoke.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/windows-running-upgrade.yml"
      - "installer/windows/**"
      - "tests/test_windows_running_upgrade.py"
      - "builds/windows-upgrade-baseline.json"
      - "app/version.py"
      - "requirements*.txt"
      - "scripts/local_distribution_smoke.py"

permissions:
  contents: read

concurrency:
  group: thistinti-windows-running-upgrade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  running-upgrade:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        shell: pwsh
        run: python -m pip install -r requirements-build.txt
      - name: Verify running-upgrade contract
        shell: pwsh
        run: python -m pytest -q tests/test_windows_running_upgrade.py
      - name: Build current Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $SourceTree = (git rev-parse "$env:GITHUB_SHA`^{tree}").Trim()
          $ArtifactName = "ThisTinti-Windows-running-upgrade-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_NUMBER"
          ./installer/windows/build_windows.ps1 `
            -SourceCommit $env:GITHUB_SHA `
            -SourceTree $SourceTree `
            -WorkflowRun $env:GITHUB_RUN_ID `
            -WorkflowRunNumber $env:GITHUB_RUN_NUMBER `
            -ArtifactName $ArtifactName
      - name: Download and verify real previous Windows alpha
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $Baseline = Get-Content "builds\windows-upgrade-baseline.json" -Raw | ConvertFrom-Json
          New-Item -ItemType Directory -Path "release\baseline" -Force | Out-Null
          gh release download $Baseline.tag `
            --pattern $Baseline.installer `
            --dir "release\baseline" `
            --clobber
          $BaselineInstaller = Join-Path "release\baseline" $Baseline.installer
          if (-not (Test-Path $BaselineInstaller)) { throw "Previous Windows alpha was not downloaded" }
          $ActualHash = (Get-FileHash $BaselineInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($ActualHash -ne $Baseline.sha256) { throw "Previous Windows alpha checksum mismatch" }
      - name: Install previous Windows alpha
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Baseline = Get-Content "builds\windows-upgrade-baseline.json" -Raw | ConvertFrom-Json
          $BaselineInstaller = (Resolve-Path (Join-Path "release\baseline" $Baseline.installer)).Path
          $InstallDir = Join-Path $env:LOCALAPPDATA "Programs\ThisTinti-Running-Upgrade"
          $DataDir = Join-Path $env:LOCALAPPDATA "ThisTinti-Running-Upgrade"
          Remove-Item $InstallDir, $DataDir -Recurse -Force -ErrorAction SilentlyContinue
          $LogPath = (Join-Path (Resolve-Path "release\windows") "running-upgrade-baseline.log")
          $Process = Start-Process -FilePath $BaselineInstaller -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/ACCEPTTHISTINTITERMS=yes",
            "/DIR=$InstallDir",
            "/LOG=$LogPath"
          ) -PassThru
          if (-not $Process.WaitForExit(180000)) {
            Stop-Process -Id $Process.Id -Force -ErrorAction SilentlyContinue
            throw "Previous Windows alpha installation timed out"
          }
          if ($Process.ExitCode -ne 0) { throw "Previous Windows alpha installation failed" }
          if (-not (Test-Path (Join-Path $InstallDir "ThisTinti.exe"))) { throw "Previous ThisTinti.exe is missing" }
          New-Item -ItemType Directory -Path $DataDir -Force | Out-Null
          "preserve" | Set-Content (Join-Path $DataDir "running-upgrade-marker.txt") -Encoding ascii
      - name: Launch previous Windows alpha and keep it running
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $InstallDir = Join-Path $env:LOCALAPPDATA "Programs\ThisTinti-Running-Upgrade"
          $DataDir = Join-Path $env:LOCALAPPDATA "ThisTinti-Running-Upgrade"
          $Exe = Join-Path $InstallDir "ThisTinti.exe"
          $Port = 18765
          $Process = Start-Process -FilePath $Exe -ArgumentList @(
            "--no-browser",
            "--data-dir", $DataDir,
            "--port", "$Port"
          ) -PassThru
          $Process.Id | Set-Content "release\windows\running-upgrade-old-pid.txt" -Encoding ascii
          $InstallDir | Set-Content "release\windows\running-upgrade-install-dir.txt" -Encoding utf8
      - name: Verify the baseline instance is healthy
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PidValue = [int](Get-Content "release\windows\running-upgrade-old-pid.txt" -Raw)
          $Healthy = $false
          for ($Attempt = 1; $Attempt -le 80; $Attempt++) {
            if (-not (Get-Process -Id $PidValue -ErrorAction SilentlyContinue)) {
              throw "Previous ThisTinti exited before the upgrade test"
            }
            try {
              $Response = Invoke-WebRequest -Uri "http://127.0.0.1:18765/api/health" -UseBasicParsing -TimeoutSec 2
              if ($Response.StatusCode -eq 200) {
                $Healthy = $true
                break
              }
            } catch {
              Start-Sleep -Milliseconds 500
            }
          }
          if (-not $Healthy) { throw "Previous ThisTinti never became healthy" }
      - name: Upgrade while previous ThisTinti is running
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Version = (Select-String -Path "app\version.py" -Pattern 'RELEASE_VERSION = "([^"]+)"').Matches.Groups[1].Value
          $Installer = (Resolve-Path "release\windows\ThisTinti-Setup-$Version-x64.exe").Path
          $InstallDir = Join-Path $env:LOCALAPPDATA "Programs\ThisTinti-Running-Upgrade"
          $LogPath = (Join-Path (Resolve-Path "release\windows") "running-upgrade-current.log")
          $Process = Start-Process -FilePath $Installer -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/ACCEPTTHISTINTITERMS=yes",
            "/DIR=$InstallDir",
            "/LOG=$LogPath"
          ) -PassThru
          if (-not $Process.WaitForExit(300000)) {
            Stop-Process -Id $Process.Id -Force -ErrorAction SilentlyContinue
            throw "Running upgrade timed out"
          }
          if ($Process.ExitCode -ne 0) { throw "Running upgrade failed with exit code $($Process.ExitCode)" }
      - name: Verify the old installed process was closed
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $InstallDir = [System.IO.Path]::GetFullPath((Get-Content "release\windows\running-upgrade-install-dir.txt" -Raw).Trim())
          $TargetExe = [System.IO.Path]::GetFullPath((Join-Path $InstallDir "ThisTinti.exe"))
          $Remaining = @(
            Get-Process -Name "ThisTinti" -ErrorAction SilentlyContinue |
              Where-Object {
                try { $_.Path -and ([System.IO.Path]::GetFullPath($_.Path) -ieq $TargetExe) } catch { $false }
              }
          )
          if ($Remaining.Count -gt 0) {
            throw "The previous installed ThisTinti process is still locking the upgraded executable"
          }
          $DataDir = Join-Path $env:LOCALAPPDATA "ThisTinti-Running-Upgrade"
          if (-not (Test-Path (Join-Path $DataDir "running-upgrade-marker.txt"))) {
            throw "Local data marker was not preserved during running upgrade"
          }
          if (-not (Test-Path $TargetExe)) { throw "Upgraded ThisTinti.exe is missing" }
      - name: Smoke-test the upgraded installed application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $InstallDir = Join-Path $env:LOCALAPPDATA "Programs\ThisTinti-Running-Upgrade"
          $DataDir = Join-Path $env:LOCALAPPDATA "ThisTinti-Running-Upgrade"
          python scripts\local_distribution_smoke.py `
            --executable (Join-Path $InstallDir "ThisTinti.exe") `
            --data-dir (Join-Path $DataDir "post-upgrade-smoke") `
            --report "release\windows\running-upgrade-smoke.json"
          if ($LASTEXITCODE -ne 0) { throw "Upgraded installed application smoke test failed" }
      - name: Upload running-upgrade evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ThisTinti-running-upgrade-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release/windows/running-upgrade-baseline.log
            release/windows/running-upgrade-current.log
            release/windows/running-upgrade-old-pid.txt
            release/windows/running-upgrade-install-dir.txt
            release/windows/running-upgrade-smoke.json
          if-no-files-found: warn
          retention-days: 30
      - name: Clean running-upgrade workspace
        if: always()
        shell: pwsh
        run: |
          $InstallDir = Join-Path $env:LOCALAPPDATA "Programs\ThisTinti-Running-Upgrade"
          $TargetExe = [System.IO.Path]::GetFullPath((Join-Path $InstallDir "ThisTinti.exe"))
          Get-Process -Name "ThisTinti" -ErrorAction SilentlyContinue |
            Where-Object {
              try { $_.Path -and ([System.IO.Path]::GetFullPath($_.Path) -ieq $TargetExe) } catch { $false }
            } |
            Stop-Process -Force -ErrorAction SilentlyContinue
          Remove-Item $InstallDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $env:LOCALAPPDATA "ThisTinti-Running-Upgrade") -Recurse -Force -ErrorAction SilentlyContinue
