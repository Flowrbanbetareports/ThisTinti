name: Format Publication Control Test

on:
  push:
    branches:
      - agent/run-current-publication-recorder
    paths:
      - .github/workflows/format-publication-control-test.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: agent/run-current-publication-recorder
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Format test
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install ruff==0.15.22
          ruff format tests/test_publication_workflow_control_plane.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_publication_workflow_control_plane.py
          if git diff --cached --quiet; then
            echo "Already formatted"
          else
            git commit -m "Format publication control-plane test"
            git push origin HEAD:agent/run-current-publication-recorder
          fi
