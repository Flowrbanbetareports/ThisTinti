name: Inspect RC10 Publication Once

on:
  push:
    branches:
      - agent/inspect-rc10-main
    paths:
      - .github/workflows/inspect-rc10-main-once.yml

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: agent/inspect-rc10-main
      - name: Capture compact RC10 publication state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p builds
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/publish-public-preview.yml/runs?per_page=10" \
            --jq '{runs: [.workflow_runs[] | {id, name, head_sha, status, conclusion, run_number, event, display_title}]}' \
            > builds/rc10-publication-compact.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builds/rc10-publication-compact.json
          git commit -m "Capture compact RC10 publication state"
          git push origin HEAD:agent/inspect-rc10-main
