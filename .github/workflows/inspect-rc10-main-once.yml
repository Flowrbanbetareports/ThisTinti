name: Inspect RC10 Main Once

on:
  push:
    branches:
      - agent/inspect-rc10-main
    paths:
      - .github/workflows/inspect-rc10-main-once.yml

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: agent/inspect-rc10-main
      - name: Capture current main workflow state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p builds
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$MAIN_SHA&per_page=30" > builds/rc10-main-runs.json
          printf '%s\n' "$MAIN_SHA" > builds/rc10-main-sha.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builds/rc10-main-runs.json builds/rc10-main-sha.txt
          git commit -m "Capture RC10 main workflow state"
          git push origin HEAD:agent/inspect-rc10-main
