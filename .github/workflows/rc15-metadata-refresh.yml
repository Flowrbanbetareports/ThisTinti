name: RC15 Metadata Refresh

on:
  push:
    branches:
      - rc15/pilot-ready
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rc15-metadata-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install generator dependencies
        run: pip install -r requirements-dev.txt
      - name: Regenerate committed release metadata
        run: |
          python scripts/generate_openapi.py --output docs/openapi.json
          python scripts/generate_sbom.py --output docs/sbom.cdx.json
      - name: Commit generated metadata when changed
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- docs/openapi.json docs/sbom.cdx.json; then
            echo "Release metadata already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/openapi.json docs/sbom.cdx.json
          git commit -m "chore(rc15): refresh release metadata"
          git push origin HEAD:rc15/pilot-ready
