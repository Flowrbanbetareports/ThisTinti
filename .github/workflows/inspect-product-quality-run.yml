name: Inspect Product Quality Run

on:
  push:
    branches:
      - agent/product-quality-pass
    paths:
      - .github/workflows/inspect-product-quality-run.yml

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: agent/product-quality-pass
      - name: Capture preparation workflow state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p builds
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/prepare-product-quality-rc10-once.yml/runs?per_page=10" > builds/product-quality-prepare-runs.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builds/product-quality-prepare-runs.json
          git commit -m "Capture product quality preparation state"
          git push origin HEAD:agent/product-quality-pass
