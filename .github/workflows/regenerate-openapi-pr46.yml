name: Regenerate PR46 OpenAPI

on:
  push:
    branches:
      - codex/rc6-recovery-center
    paths:
      - ".github/workflows/regenerate-openapi-pr46.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: codex/rc6-recovery-center
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install locked development dependencies
        run: pip install -r requirements-dev.txt
      - name: Generate the committed API contract
        run: python scripts/generate_openapi.py --output docs/openapi.json
      - name: Commit reproducible contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/openapi.json
          git diff --cached --quiet && exit 0
          git commit -m "Regenerate RC6 recovery OpenAPI contract"
          git push origin HEAD:codex/rc6-recovery-center
