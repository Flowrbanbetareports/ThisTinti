name: Procurement Format Probe

on:
  push:
    branches:
      - hardening/procurement-provenance-matrix-v1
    paths:
      - ".github/workflows/procurement-format-probe.yml"
      - "scripts/procurement_pilot/freeze.py"
      - "tests/test_procurement_provenance_matrix.py"

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install canonical Ruff
        run: python -m pip install ruff==0.15.22
      - name: Show canonical formatting diff
        run: |
          python -m ruff format scripts/procurement_pilot/freeze.py tests/test_procurement_provenance_matrix.py
          git diff -- scripts/procurement_pilot/freeze.py tests/test_procurement_provenance_matrix.py
