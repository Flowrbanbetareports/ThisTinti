name: Fix Apparel Scan Overrides

on:
  push:
    branches:
      - agent/apparel-pilot-30
    paths:
      - .github/workflows/fix-apparel-scan-overrides.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: agent/apparel-pilot-30
      - name: Supply the required PDF document type
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/run_apparel_pilot.py")
          text = path.read_text(encoding="utf-8")
          old = '''                    "application/pdf",
                    {},
                )'''
          new = '''                    "application/pdf",
                    {"document_type": "invoice"},
                )'''
          if old not in text:
              raise SystemExit("Target scan ingest call was not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run_apparel_pilot.py
          git commit -m "Provide invoice type for scan diagnostics"
          git push origin HEAD:agent/apparel-pilot-30
