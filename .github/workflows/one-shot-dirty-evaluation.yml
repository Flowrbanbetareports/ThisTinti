name: One-shot dirty corpus evaluation

on:
  push:
    branches:
      - benchmark/dirty-public-corpus-22
    paths:
      - .github/workflows/one-shot-dirty-evaluation.yml

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: benchmark/dirty-public-corpus-22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install OCR runtime
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-ita
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run regression tests
        run: pytest -q tests/test_pdf_semantics.py tests/test_parsers.py tests/test_dirty_public_corpus.py tests/test_dirty_public_semantic_evaluator.py
      - name: Run raw corpus
        env:
          THISTINTI_OCR_ENABLED: "true"
          THISTINTI_OCR_LANGUAGES: "ita+eng"
        run: |
          mkdir -p builds
          python scripts/run_dirty_public_corpus.py --manifest samples/dirty_public_corpus_22.json --report builds/dirty.json --markdown builds/dirty.md
      - name: Run granular semantic evaluator
        env:
          THISTINTI_OCR_ENABLED: "true"
          THISTINTI_OCR_LANGUAGES: "ita+eng"
        run: |
          python scripts/evaluate_dirty_public_semantics.py --manifest samples/dirty_public_corpus_22.json --truth samples/dirty_public_corpus_22_ground_truth.json --report builds/semantic.json --markdown builds/semantic.md
      - name: Print reports
        if: always()
        run: |
          cat builds/dirty.md 2>/dev/null || true
          cat builds/semantic.md 2>/dev/null || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: one-shot-dirty-evaluation-${{ github.run_id }}
          path: builds/
          retention-days: 30
