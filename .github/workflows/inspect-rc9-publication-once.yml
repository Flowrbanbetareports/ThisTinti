name: Inspect RC9 Publication Once

on:
  push:
    branches:
      - agent/inspect-rc9-publication
    paths:
      - .github/workflows/inspect-rc9-publication-once.yml

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: agent/inspect-rc9-publication
      - name: Capture RC9 publication workflow state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p builds
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/publish-public-preview.yml/runs?per_page=10" > builds/rc9-publication-runs.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builds/rc9-publication-runs.json
          git commit -m "Capture RC9 publication workflow state"
          git push origin HEAD:agent/inspect-rc9-publication
