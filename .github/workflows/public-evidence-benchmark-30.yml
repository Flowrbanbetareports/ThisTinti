name: Public Evidence Benchmark 30

on:
  pull_request:
    paths:
      - samples/public_evidence_benchmark_30_sources.json
      - scripts/build_public_evidence_benchmark.py
      - scripts/run_public_evidence_benchmark.py
      - tests/test_public_evidence_benchmark.py
      - docs/PUBLIC_EVIDENCE_BENCHMARK_30.md
      - .github/workflows/public-evidence-benchmark-30.yml
  push:
    branches:
      - main
    paths:
      - samples/public_evidence_benchmark_30_sources.json
      - scripts/build_public_evidence_benchmark.py
      - scripts/run_public_evidence_benchmark.py
      - tests/test_public_evidence_benchmark.py
      - docs/PUBLIC_EVIDENCE_BENCHMARK_30.md
      - .github/workflows/public-evidence-benchmark-30.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-evidence-benchmark-30-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      THISTINTI_ENV: test
      THISTINTI_DATABASE_URL: sqlite:///./public-evidence-benchmark.db
      THISTINTI_SECRET_KEY: public-evidence-benchmark-secret-key-more-than-thirty-two-characters
      THISTINTI_AUTO_CREATE_SCHEMA: "false"
      THISTINTI_ALLOW_REGISTRATION: "true"
      THISTINTI_SECURE_COOKIES: "false"
      THISTINTI_STORAGE_DIR: ./public-evidence-data/uploads
      THISTINTI_QUARANTINE_DIR: ./public-evidence-data/quarantine
      THISTINTI_REJECTED_DIR: ./public-evidence-data/rejected
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Prepare isolated database
        run: |
          rm -f public-evidence-benchmark.db
          alembic upgrade head
      - name: Build frozen benchmark and separate ground truth
        run: |
          mkdir -p builds
          python scripts/build_public_evidence_benchmark.py \
            --dataset builds/public-evidence-benchmark-30-dataset.json \
            --ground-truth builds/public-evidence-benchmark-30-ground-truth.json
      - name: Verify structure, provenance and governance boundary
        run: |
          pytest -q tests/test_public_evidence_benchmark.py
          python scripts/validate_pilot_dataset.py \
            builds/public-evidence-benchmark-30-dataset.json \
            --report builds/public-evidence-benchmark-30-inspection.json
      - name: Run benchmark against current engine
        run: |
          python scripts/run_public_evidence_benchmark.py \
            builds/public-evidence-benchmark-30-dataset.json \
            builds/public-evidence-benchmark-30-ground-truth.json \
            --report builds/public-evidence-benchmark-30-latest.json \
            --markdown builds/public-evidence-benchmark-30-latest.md
      - name: Print benchmark summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("builds/public-evidence-benchmark-30-latest.json")
          if not path.is_file():
              print("benchmark report not produced")
              raise SystemExit(0)
          report = json.loads(path.read_text(encoding="utf-8"))
          print(json.dumps({
              "classification": report["classification"],
              "integrity": report["integrity"],
              "metrics": report["metrics"],
          }, ensure_ascii=False, indent=2))
          PY
      - name: Upload immutable benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-evidence-benchmark-30-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            builds/public-evidence-benchmark-30-dataset.json
            builds/public-evidence-benchmark-30-ground-truth.json
            builds/public-evidence-benchmark-30-inspection.json
            builds/public-evidence-benchmark-30-latest.json
            builds/public-evidence-benchmark-30-latest.md
          retention-days: 30
