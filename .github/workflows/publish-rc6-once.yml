name: Publish verified RC6 once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-rc6-once.yml"

permissions:
  actions: read
  attestations: write
  id-token: write
  contents: write

concurrency:
  group: thistinti-publish-verified-rc6-once
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION: 3.4.0-alpha.7-rc.6
      TAG: v3.4.0-alpha.7-rc.6
      TARGET_SHA: 0c86e669bbbecadcada3581dfd842a2f7fd9c3b5
      SOURCE_TREE: 5b42ee40bb948d6133afc50605534dd1028f478e
      WINDOWS_RUN_ID: "30193231940"
      ARTIFACT_NAME: ThisTinti-Windows-30193231940-200
      EXPECTED_INSTALLER_SHA256: f77b59b3b4ef8510fc0e9773f5840962fb23e9d3353dec8730d4c595f6d6bf89
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Constrain immutable release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test "$(python -c 'from app.version import RELEASE_VERSION; print(RELEASE_VERSION)')" = "$VERSION"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$TARGET_SHA" origin/main

      - name: Re-run complete release gate
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openssl poppler-utils tesseract-ocr tesseract-ocr-eng tesseract-ocr-ita
          pip install -r requirements-dev.txt
          make verify

      - name: Require exact green workflows and Windows build
        shell: bash
        run: |
          python scripts/verify_publish_candidate.py \
            --repository "$GITHUB_REPOSITORY" \
            --target-sha "$TARGET_SHA" \
            --windows-run-id "$WINDOWS_RUN_ID" \
            --output candidate.json
          test "$(python -c 'import json; print(json.load(open("candidate.json"))["artifact_name"])')" = "$ARTIFACT_NAME"

      - name: Download exact verified Windows artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$WINDOWS_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir dist

      - name: Verify checksums, smoke reports and source provenance
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_release_artifact.py \
            --directory dist \
            --expected-version "$VERSION" \
            --expected-commit "$TARGET_SHA" \
            --expected-tree "$SOURCE_TREE"
          ACTUAL="$(sha256sum "dist/ThisTinti-Setup-$VERSION-x64.exe" | cut -d' ' -f1)"
          test "$ACTUAL" = "$EXPECTED_INSTALLER_SHA256"

      - name: Generate verified release attestations
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            dist/ThisTinti-Setup-3.4.0-alpha.7-rc.6-x64.exe
            dist/ThisTinti-Portable-3.4.0-alpha.7-rc.6-x64.zip
            dist/ThisTinti-3.4.0-alpha.7-rc.6-self-hosted-source.zip

      - name: Verify generated attestations
        shell: bash
        run: |
          set -euo pipefail
          gh attestation verify "dist/ThisTinti-Setup-$VERSION-x64.exe" --repo "$GITHUB_REPOSITORY"
          gh attestation verify "dist/ThisTinti-Portable-$VERSION-x64.zip" --repo "$GITHUB_REPOSITORY"
          gh attestation verify "dist/ThisTinti-$VERSION-self-hosted-source.zip" --repo "$GITHUB_REPOSITORY"

      - name: Refuse release replacement
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; releases are immutable" >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; assets will not be replaced" >&2
            exit 1
          fi

      - name: Prepare truthful Public Preview notes
        shell: bash
        run: |
          {
            printf '## ThisTinti %s — Public Preview\n\n' "$VERSION"
            printf 'Workspace locale e supervisionato per riconciliare catene documentali e preparare evidenze di possibili discrepanze.\n\n'
            printf 'Questa è una Public Preview alpha/RC: gli output sono informativi, richiedono verifica sui documenti originali e non certificano documenti né autorizzano decisioni economiche.\n\n'
            printf '### Provenienza verificata\n\n'
            printf -- '- Commit: `%s`\n' "$TARGET_SHA"
            printf -- '- Tree Git: `%s`\n' "$SOURCE_TREE"
            printf -- '- Workflow Windows: `%s`\n' "$WINDOWS_RUN_ID"
            printf -- '- SHA-256 installer: `%s`\n\n' "$EXPECTED_INSTALLER_SHA256"
            printf '### Modifiche\n\n'
            cat RELEASE_NOTES.md
            printf '\n### Firma Windows\n\n'
            printf 'L’installer non è ancora firmato Authenticode. Verificare SHA-256 e attestazione GitHub; Windows può mostrare “Editore sconosciuto”.\n'
          } > public-preview-notes.md

      - name: Publish immutable prerelease assets
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "ThisTinti $VERSION — Public Preview" \
            --notes-file public-preview-notes.md \
            --prerelease

      - name: Record publication evidence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/record_github_publication.py \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --source-commit "$TARGET_SHA" \
            --source-tree "$SOURCE_TREE" \
            --artifact-directory dist \
            --release-output /tmp/release-latest.json \
            --publication-output /tmp/publication-latest.json
          git checkout main
          git pull --ff-only origin main
          cp /tmp/release-latest.json builds/release-latest.json
          cp /tmp/publication-latest.json builds/publication-latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builds/release-latest.json builds/publication-latest.json
          git commit -m "Record Public Preview $VERSION publication"
          git push origin main
