name: Prepare RC11 Candidate on PR

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/prepare_rc11_candidate.py
      - .github/workflows/prepare-rc11-candidate-on-pr.yml

permissions:
  contents: write

concurrency:
  group: rc11-candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      THISTINTI_ENV: test
      THISTINTI_DATABASE_URL: sqlite:///./rc11-candidate.db
      THISTINTI_SECRET_KEY: rc11-candidate-secret-more-than-thirty-two-characters
      THISTINTI_AUTO_CREATE_SCHEMA: "false"
      THISTINTI_ALLOW_REGISTRATION: "true"
      THISTINTI_SECURE_COOKIES: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: agent/rc11-operational-center
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Apply coherent unreleased RC11 identity
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_rc11_candidate.py
          python - <<'PY'
          from pathlib import Path
          path = Path('installer/windows/ThisTinti.iss')
          text = path.read_bytes().decode('utf-8').replace('\r\n', '\n').replace('\r', '\n')
          path.write_bytes(text.replace('\n', '\r\n').encode('utf-8'))
          PY
          python -m pip install -r requirements-dev.txt
          python scripts/generate_openapi.py
          python scripts/generate_sbom.py
          python -m ruff format app tests scripts migrations run_thistinti.py
          python scripts/check_release_consistency.py
          python -m pytest -q \
            tests/test_rebrand.py \
            tests/test_simplified_experience.py \
            tests/test_release_integrity.py \
            tests/test_operational_center.py \
            tests/test_operational_center_assets.py \
            tests/test_rules_presentation.py
          python -m ruff check app tests scripts migrations run_thistinti.py
          node --check app/static/app.js
          node --check app/static/operational-center.js
          node --check app/static/operational-learning.js
          git diff --check -- . ':(exclude)installer/windows/ThisTinti.iss'
      - name: Commit tested RC11 identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/prepare_rc11_candidate.py \
            app/version.py \
            app/static/app.js \
            pyproject.toml \
            installer/windows/ThisTinti.iss \
            tests/test_rebrand.py \
            tests/test_simplified_experience.py \
            README.md \
            RELEASE_NOTES.md \
            ROADMAP.md \
            docs/BETA_READINESS_STATUS.md \
            docs/OPERATIONS.md \
            docs/PRODUCTION_READINESS.md \
            docs/THREAT_MODEL.md \
            docs/evidence/beta/external-gates.json \
            docs/openapi.json \
            docs/sbom.cdx.json \
            docs/RC11_OPERATIONAL_CENTER.md \
            docs/RC11_INTERNAL_CANDIDATE.md
          git commit -m "Set the supervised operational candidate to RC11"
          git push origin HEAD:agent/rc11-operational-center
