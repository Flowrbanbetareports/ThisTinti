name: Provenance Format Probe

on:
  push:
    branches:
      - pilot/provenance-invoiced-over-received

permissions:
  contents: read

jobs:
  ruff-format-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Show canonical Ruff formatting diff
        run: |
          python -m ruff format --diff \
            app/services/invoiced_over_received_provenance.py \
            app/services/judgment_provenance.py \
            tests/test_provenance_invoiced_over_received.py \
            tests/test_provenance_invoiced_over_received_properties.py
