name: Provenance Format Probe

on:
  push:
    branches:
      - pilot/provenance-invoiced-over-received

permissions:
  contents: write

jobs:
  ruff-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Apply canonical Ruff formatting
        run: |
          python -m ruff format \
            app/services/invoiced_over_received_provenance.py \
            app/services/judgment_provenance.py \
            tests/test_provenance_invoiced_over_received.py \
            tests/test_provenance_invoiced_over_received_properties.py
          if git diff --quiet -- \
            app/services/invoiced_over_received_provenance.py \
            app/services/judgment_provenance.py \
            tests/test_provenance_invoiced_over_received.py \
            tests/test_provenance_invoiced_over_received_properties.py; then
            exit 0
          fi
          git config user.name "ThisTinti CI"
          git config user.email "actions@users.noreply.github.com"
          git add \
            app/services/invoiced_over_received_provenance.py \
            app/services/judgment_provenance.py \
            tests/test_provenance_invoiced_over_received.py \
            tests/test_provenance_invoiced_over_received_properties.py
          git commit -m "Apply canonical Ruff formatting"
          git push origin HEAD:pilot/provenance-invoiced-over-received
