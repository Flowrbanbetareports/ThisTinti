name: One-shot format semantic evaluator

on:
  push:
    branches:
      - benchmark/dirty-public-corpus-22
    paths:
      - .github/workflows/one-shot-format-semantic-evaluator.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: benchmark/dirty-public-corpus-22
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install formatter
        run: python -m pip install ruff==0.15.22
      - name: Format and validate evaluator
        run: |
          ruff format scripts/evaluate_dirty_public_semantics.py tests/test_dirty_public_semantic_evaluator.py
          ruff check scripts/evaluate_dirty_public_semantics.py tests/test_dirty_public_semantic_evaluator.py
      - name: Commit formatted files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/evaluate_dirty_public_semantics.py tests/test_dirty_public_semantic_evaluator.py
          if git diff --cached --quiet; then
            echo 'Already formatted'
          else
            git diff --cached --check
            git commit -m 'Format semantic evaluator'
            git push origin HEAD:benchmark/dirty-public-corpus-22
          fi
