name: Apply Trusted RC6 Manual Links

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: trusted-rc6-manual-links
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.number == 47 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/rc6-manual-links'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: codex/rc6-manual-links
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Reassemble and verify immutable patch
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          cat .automation/rc6-manual-links.patch.gz.b64.part* | base64 --decode | gzip -dc > /tmp/rc6-manual-links.patch
          echo "8c265a115731970b2b684aec9687eebe32fe784a7c5ee043fde14340498c8c65  /tmp/rc6-manual-links.patch" | sha256sum -c -
          if git apply --check /tmp/rc6-manual-links.patch; then
            git apply /tmp/rc6-manual-links.patch
            echo "applied=true" >> "$GITHUB_OUTPUT"
          elif git apply --reverse --check /tmp/rc6-manual-links.patch; then
            echo "Patch already applied"
            echo "applied=false" >> "$GITHUB_OUTPUT"
          else
            echo "Patch does not apply cleanly in either direction" >&2
            exit 1
          fi
      - name: Install locked development dependencies
        run: pip install -r requirements-dev.txt
      - name: Normalize generated and Python files
        shell: bash
        run: |
          set -euo pipefail
          ruff format \
            app/main.py \
            app/schemas.py \
            app/services/matching.py \
            scripts/check_chain_links_browser.py \
            tests/test_chain_link_options.py \
            tests/test_simplified_experience.py
          python scripts/generate_openapi.py
      - name: Verify focused regressions
        shell: bash
        run: |
          set -euo pipefail
          ruff check \
            app/main.py \
            app/schemas.py \
            app/services/matching.py \
            scripts/check_chain_links_browser.py \
            tests/test_chain_link_options.py \
            tests/test_simplified_experience.py
          pytest -q tests/test_chain_link_options.py tests/test_simplified_experience.py
          node --check app/static/app-core.js
          git diff --check
      - name: Commit and push verified product files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/simplified-experience.yml \
            app/main.py \
            app/schemas.py \
            app/services/matching.py \
            app/static/app-core.js \
            app/static/styles-original.css \
            docs/USER_GUIDE_SIMPLE.md \
            docs/openapi.json \
            scripts/check_chain_links_browser.py \
            tests/test_chain_link_options.py \
            tests/test_simplified_experience.py
          if git diff --cached --quiet; then
            echo "No product changes to publish"
          else
            git commit -m "RC6 Manual Links: supervised attach, detach and reanalysis"
            git push origin HEAD:codex/rc6-manual-links
          fi
