name: RC15 Maintenance 3
on:
  push:
    branches: [rc15/pilot-ready]
permissions:
  contents: write
jobs:
  maintain:
    if: ${{ !contains(github.event.head_commit.message, '[rc15-maintenance-done]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: rc15/pilot-ready
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Reuse hardened refinement blocks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          lines = Path('.github/workflows/rc15-maintenance2.yml').read_text(encoding='utf-8').splitlines()

          def extract(step_name):
              start = next(i for i, line in enumerate(lines) if line.strip() == f'- name: {step_name}')
              run = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'run: |')
              block = []
              for line in lines[run + 1:]:
                  if line.startswith('      - name:'):
                      break
                  block.append(line[10:] if line.startswith('          ') else line)
              return '\n'.join(block) + '\n'

          for name in ('Apply RC15 refinements', 'Add focused RC15 tests'):
              subprocess.run(['bash', '-euo', 'pipefail', '-c', extract(name)], check=True)
          PY
          python - <<'PY'
          from pathlib import Path
          p = Path('app/services/rc15.py')
          t = p.read_text(encoding='utf-8')
          t = t.replace('from .ingestion import document_parse_error_detail, reprocess_document', 'from .ingestion import document_parse_error_detail')
          p.write_text(t, encoding='utf-8')
          PY
      - name: Validate focused RC15 changes
        shell: bash
        run: |
          pip install -r requirements-dev.txt
          ruff format app/rc15_api.py app/services/rc15.py app/rc15_models.py migrations/versions/e15c0a7f4d21_add_rc15_pilot_ready.py tests/test_rc15_pilot_ready.py tests/test_simplified_experience.py
          ruff check --fix app/rc15_api.py app/services/rc15.py app/rc15_models.py tests/test_rc15_pilot_ready.py
          ruff check app/rc15_api.py app/services/rc15.py app/rc15_models.py tests/test_rc15_pilot_ready.py
          pytest -q tests/test_rc15_pilot_ready.py tests/test_module_boundaries.py
      - name: Commit result and remove maintenance helpers
        shell: bash
        run: |
          rm -f .github/workflows/rc15-maintenance.yml .github/workflows/rc15-maintenance2.yml .github/workflows/rc15-maintenance3.yml
          git config user.name "ThisTinti"
          git config user.email "flowrbanbetareports@gmail.com"
          git add -A
          git commit -m "RC15: harden pilot methodology and integration [rc15-maintenance-done]"
          git push origin HEAD:rc15/pilot-ready
