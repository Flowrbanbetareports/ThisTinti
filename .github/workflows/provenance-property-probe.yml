name: Provenance Property Deep Qualification

on:
  push:
    branches:
      - test/provenance-properties-v0
    paths:
      - .github/workflows/provenance-property-probe.yml

permissions:
  contents: read

jobs:
  qualify-deep-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      THISTINTI_OCR_ENABLED: "false"
      THISTINTI_HYPOTHESIS_PROFILE: "deep"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install development dependencies
        run: pip install -r requirements-dev.txt
      - name: Verify qualified source bytes and static gates
        run: |
          python -m ruff format --check app/services/finding_provenance.py app/services/judgment_provenance.py tests/test_provenance_properties.py
          python -m ruff check app/services/finding_provenance.py app/services/judgment_provenance.py tests/test_provenance_properties.py
          python -m py_compile app/services/finding_provenance.py app/services/judgment_provenance.py tests/test_provenance_properties.py
          python scripts/check_module_boundaries.py
          python scripts/check_dependencies.py
      - name: Verify runtime SBOM is byte-identical
        run: |
          cp docs/sbom.cdx.json /tmp/sbom-before.cdx.json
          python scripts/generate_sbom.py
          cmp /tmp/sbom-before.cdx.json docs/sbom.cdx.json
          git diff --exit-code -- docs/sbom.cdx.json
      - name: Run 22 provenance tests at deep profile
        run: >-
          python -m pytest -q
          tests/test_provenance_contract_v0.py
          tests/test_provenance_persistence.py
          tests/test_duplicate_number_finding_provenance.py
          tests/test_finding_judgment_provenance.py
          tests/test_provenance_properties.py
      - name: Record deep qualification evidence
        if: success()
        run: |
          printf '%s\n' \
            "head_sha=${GITHUB_SHA}" \
            "hypothesis_profile=${THISTINTI_HYPOTHESIS_PROFILE}" \
            "max_examples=2000" \
            "stateful_step_count=75" \
            > provenance-deep-qualification.txt
      - name: Upload deep qualification evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: provenance-deep-qualified-${{ github.run_id }}-${{ github.run_attempt }}
          path: provenance-deep-qualification.txt
          retention-days: 7
