      - "app/static/commercial.html"
      - "app/static/commercial.css"
      - "app/static/commercial.js"
      - "app/static/app-core.js"
      - "app/static/onboarding.js"
      - "app/static/onboarding.css"
      - "app/static/product-polish.js"
      - "app/static/product-polish.css"
      - "app/static/operational-center.js"
      - "app/static/operational-center.css"
      - "app/static/operational-learning.js"
      - "app/static/operational-learning.css"
      - "app/static/operational-report.html"
      - "app/static/operational-report.css"
      - "app/static/operational-report.js"
      - "app/static/sidebar-scroll.css"
      - "app/static/sidebar-scroll.js"
      - "app/static/local-first-run.js"
      - "app/static/local-first-run.css"
      - "app/static/diagnostics.html"
      - "app/static/diagnostics.css"
      - "app/static/diagnostics.js"
      - "app/static/diagnostics-link.js"
      - "app/services/operational.py"
      - "app/services/commercial.py"
      - "app/services/rules.py"
      - "tests/test_frontend_security.py"
      - "tests/test_security_hardening.py"
      - "tests/test_simplified_experience.py"
      - "tests/test_product_quality_pass.py"
      - "tests/test_commercial_readiness.py"
      - "tests/test_operational_center.py"
      - "tests/test_operational_center_assets.py"
      - "tests/test_rules_presentation.py"
      - "scripts/check_sidebar_browser.py"
      - "scripts/check_evidence_browser.py"
      - "scripts/check_product_polish_browser.py"
      - "scripts/check_operational_center_browser.py"
      - "scripts/check_operational_center_live_browser.py"
      - "scripts/check_commercial_readiness_browser.py"
      - "scripts/browser_e2e.py"
      - "scripts/check_job_recovery_browser.py"
      - "scripts/check_chain_links_browser.py"
      - "scripts/check_in_app_diagnostics_browser.py"
      - "docs/IN_APP_DIAGNOSTICS.md"
      - "docs/RC11_OPERATIONAL_CENTER.md"
      - "docs/LIGHT_COMMERCIAL_READINESS.md"
      - "docs/DIGITAL_PURCHASE_POLICY_TEMPLATE.md"
      - "docs/SIMPLIFIED_PRODUCT_EXPERIENCE_PROGRAM.md"
      - ".github/workflows/simplified-experience.yml"
  push:
    branches: [main]
    paths:
      - "app/static/app.js"
      - "app/static/commercial.html"
      - "app/static/commercial.css"
      - "app/static/commercial.js"
      - "app/static/app-core.js"
      - "app/static/onboarding.js"
      - "app/static/onboarding.css"
      - "app/static/product-polish.js"
      - "app/static/product-polish.css"
      - "app/static/operational-center.js"
      - "app/static/operational-center.css"
      - "app/static/operational-learning.js"
      - "app/static/operational-learning.css"
      - "app/static/operational-report.html"
      - "app/static/operational-report.css"
      - "app/static/operational-report.js"
      - "app/static/sidebar-scroll.css"
      - "app/static/sidebar-scroll.js"
      - "app/static/local-first-run.js"
      - "app/static/local-first-run.css"
      - "app/static/diagnostics.html"
      - "app/static/diagnostics.css"
      - "app/static/diagnostics.js"
      - "app/static/diagnostics-link.js"
      - "app/services/operational.py"
      - "app/services/commercial.py"
      - "app/services/rules.py"
      - "tests/test_frontend_security.py"
      - "tests/test_security_hardening.py"
      - "tests/test_simplified_experience.py"
      - "tests/test_product_quality_pass.py"
      - "tests/test_commercial_readiness.py"
      - "tests/test_operational_center.py"
      - "tests/test_operational_center_assets.py"
      - "tests/test_rules_presentation.py"
      - "scripts/check_sidebar_browser.py"
      - "scripts/check_evidence_browser.py"
      - "scripts/check_product_polish_browser.py"
      - "scripts/check_operational_center_browser.py"
      - "scripts/check_operational_center_live_browser.py"
      - "scripts/check_commercial_readiness_browser.py"
      - "scripts/browser_e2e.py"
      - "scripts/check_job_recovery_browser.py"
      - "scripts/check_chain_links_browser.py"
      - "scripts/check_in_app_diagnostics_browser.py"
      - "docs/IN_APP_DIAGNOSTICS.md"
      - "docs/RC11_OPERATIONAL_CENTER.md"
      - "docs/LIGHT_COMMERCIAL_READINESS.md"
      - "docs/DIGITAL_PURCHASE_POLICY_TEMPLATE.md"
      - "docs/SIMPLIFIED_PRODUCT_EXPERIENCE_PROGRAM.md"
      - ".github/workflows/simplified-experience.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simplified-experience-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Validate JavaScript syntax
        run: |
          node --check app/static/app.js
          node --check app/static/commercial.js
          node --check app/static/app-core.js
          node --check app/static/onboarding.js
          node --check app/static/product-polish.js
          node --check app/static/operational-center.js
          node --check app/static/operational-learning.js
          node --check app/static/operational-report.js
          node --check app/static/sidebar-scroll.js
          node --check app/static/local-first-run.js
          node --check app/static/diagnostics.js
          node --check app/static/diagnostics-link.js
      - name: Install test dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install playwright==1.55.0
          python -m playwright install chromium
      - name: Verify sidebar layout in Chromium
        run: python scripts/check_sidebar_browser.py
      - name: Verify evidence workflow in Chromium
        run: python scripts/check_evidence_browser.py
      - name: Verify product terminology and hierarchy in Chromium
        run: python scripts/check_product_polish_browser.py
      - name: Verify operational center fixture in Chromium
        run: python scripts/check_operational_center_browser.py
      - name: Verify operational center against the live app
        run: python scripts/check_operational_center_live_browser.py
      - name: Verify light commercial readiness against the live app
        run: python scripts/check_commercial_readiness_browser.py
      - name: Verify recovery workflow in Chromium
        run: python scripts/check_job_recovery_browser.py
      - name: Verify supervised chain links in Chromium
        run: python scripts/check_chain_links_browser.py
      - name: Verify in-app diagnostics in Chromium
        run: python scripts/check_in_app_diagnostics_browser.py
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: browser-evidence/
          if-no-files-found: error
      - name: Run experience and security regressions
        run: |
          pytest -q \
            tests/test_frontend_security.py \
            tests/test_simplified_experience.py \
            tests/test_product_quality_pass.py \
            tests/test_commercial_readiness.py \
            tests/test_operational_center.py \
            tests/test_operational_center_assets.py \
            tests/test_rules_presentation.py \
            tests/test_security_hardening.py::test_frontend_core_remains_auditable_with_a_bounded_experience_layer
