name: Simplified Product Experience

on:
  pull_request:
    paths:
      - "app/static/app.js"
      - "app/static/app-core.js"
      - "app/static/onboarding.js"
      - "app/static/onboarding.css"
      - "app/static/product-polish.js"
      - "app/static/product-polish.css"
      - "app/static/sidebar-scroll.css"
      - "app/static/sidebar-scroll.js"
      - "app/static/local-first-run.js"
      - "app/static/local-first-run.css"
      - "app/static/diagnostics.html"
      - "app/static/diagnostics.css"
      - "app/static/diagnostics.js"
      - "app/static/diagnostics-link.js"
      - "tests/test_frontend_security.py"
      - "tests/test_security_hardening.py"
      - "tests/test_simplified_experience.py"
      - "tests/test_product_quality_pass.py"
      - "scripts/check_sidebar_browser.py"
      - "scripts/check_evidence_browser.py"
      - "scripts/check_product_polish_browser.py"
      - "scripts/browser_e2e.py"
      - "scripts/check_job_recovery_browser.py"
      - "scripts/check_chain_links_browser.py"
      - "scripts/check_in_app_diagnostics_browser.py"
      - "docs/IN_APP_DIAGNOSTICS.md"
      - "docs/SIMPLIFIED_PRODUCT_EXPERIENCE_PROGRAM.md"
      - ".github/workflows/simplified-experience.yml"
  push:
    branches: [main]
    paths:
      - "app/static/app.js"
      - "app/static/app-core.js"
      - "app/static/onboarding.js"
      - "app/static/onboarding.css"
      - "app/static/product-polish.js"
      - "app/static/product-polish.css"
      - "app/static/sidebar-scroll.css"
      - "app/static/sidebar-scroll.js"
      - "app/static/local-first-run.js"
      - "app/static/local-first-run.css"
      - "app/static/diagnostics.html"
      - "app/static/diagnostics.css"
      - "app/static/diagnostics.js"
      - "app/static/diagnostics-link.js"
      - "tests/test_frontend_security.py"
      - "tests/test_security_hardening.py"
      - "tests/test_simplified_experience.py"
      - "tests/test_product_quality_pass.py"
      - "scripts/check_sidebar_browser.py"
      - "scripts/check_evidence_browser.py"
      - "scripts/check_product_polish_browser.py"
      - "scripts/browser_e2e.py"
      - "scripts/check_job_recovery_browser.py"
      - "scripts/check_chain_links_browser.py"
      - "scripts/check_in_app_diagnostics_browser.py"
      - "docs/IN_APP_DIAGNOSTICS.md"
      - "docs/SIMPLIFIED_PRODUCT_EXPERIENCE_PROGRAM.md"
      - ".github/workflows/simplified-experience.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simplified-experience-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Validate JavaScript syntax
        run: |
          node --check app/static/app.js
          node --check app/static/app-core.js
          node --check app/static/onboarding.js
          node --check app/static/product-polish.js
          node --check app/static/sidebar-scroll.js
          node --check app/static/local-first-run.js
          node --check app/static/diagnostics.js
          node --check app/static/diagnostics-link.js
      - name: Install test dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install playwright==1.55.0
          python -m playwright install chromium
      - name: Verify sidebar layout in Chromium
        run: python scripts/check_sidebar_browser.py
      - name: Verify evidence workflow in Chromium
        run: python scripts/check_evidence_browser.py
      - name: Verify product terminology and hierarchy in Chromium
        run: python scripts/check_product_polish_browser.py
      - name: Verify recovery workflow in Chromium
        run: python scripts/check_job_recovery_browser.py
      - name: Verify supervised chain links in Chromium
        run: python scripts/check_chain_links_browser.py
      - name: Verify in-app diagnostics in Chromium
        run: python scripts/check_in_app_diagnostics_browser.py
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: browser-evidence/
          if-no-files-found: error
      - name: Run experience and security regressions
        run: |
          pytest -q \
            tests/test_frontend_security.py \
            tests/test_simplified_experience.py \
            tests/test_product_quality_pass.py \
            tests/test_security_hardening.py::test_frontend_core_remains_auditable_with_a_bounded_experience_layer
