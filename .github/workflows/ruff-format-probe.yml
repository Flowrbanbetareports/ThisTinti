name: Ruff Format Probe

on:
  push:
    branches:
      - provenance/duplicate-number-finding-v0
    paths:
      - .github/workflows/ruff-format-probe.yml

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: provenance/duplicate-number-finding-v0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
      - name: Install exact formatter
        run: pip install ruff==0.15.22
      - name: Format and emit exact content
        shell: bash
        run: |
          python -m ruff format tests/test_duplicate_number_finding_provenance.py
          python - <<'PY'
          import base64
          from pathlib import Path
          payload = Path('tests/test_duplicate_number_finding_provenance.py').read_bytes()
          print('RUFF_FORMATTED_B64_BEGIN')
          print(base64.b64encode(payload).decode('ascii'))
          print('RUFF_FORMATTED_B64_END')
          PY
