name: Fix Public Benchmark Bandit

on:
  push:
    branches:
      - benchmark/public-evidence-30

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: benchmark/public-evidence-30
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Remove Bandit B105 false positive without suppressing Bandit
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/build_public_evidence_benchmark.py")
          text = path.read_text(encoding="utf-8")
          old = '    dataset = {\n'
          new = '    all_scenarios_required = False\n    dataset = {\n'
          if old not in text:
              raise SystemExit("dataset assignment anchor not found")
          text = text.replace(old, new, 1)
          old_value = '            "require_all_scenarios_pass": False,\n'
          new_value = '            "require_all_scenarios_pass": all_scenarios_required,\n'
          if old_value not in text:
              raise SystemExit("gate key anchor not found")
          text = text.replace(old_value, new_value, 1)
          path.write_text(text, encoding="utf-8")
          PY
          python -m pip install ruff==0.15.22 bandit==1.9.4
          ruff format scripts/build_public_evidence_benchmark.py
          ruff check scripts/build_public_evidence_benchmark.py
          bandit -q scripts/build_public_evidence_benchmark.py
      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build_public_evidence_benchmark.py
          if git diff --cached --quiet; then
            echo "Patch already applied"
            exit 0
          fi
          git commit -m "Fix benchmark Bandit false positive"
          git push origin HEAD:benchmark/public-evidence-30
