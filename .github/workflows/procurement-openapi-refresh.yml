name: Procurement OpenAPI Refresh

on:
  push:
    branches:
      - hardening/procurement-provenance-matrix-v1
    paths:
      - ".github/workflows/procurement-openapi-refresh.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install canonical development dependencies
        run: pip install -r requirements-dev.txt
      - name: Generate canonical OpenAPI contract
        run: |
          mkdir -p generated
          python scripts/generate_openapi.py --output generated/openapi.json
      - name: Upload generated contract
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: procurement-openapi-${{ github.sha }}
          path: generated/openapi.json
          retention-days: 1
