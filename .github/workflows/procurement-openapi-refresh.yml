name: Procurement OpenAPI Refresh

on:
  push:
    branches:
      - hardening/procurement-provenance-matrix-v1
    paths:
      - ".github/workflows/procurement-openapi-refresh.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: hardening/procurement-provenance-matrix-v1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install canonical development dependencies
        run: pip install -r requirements-dev.txt
      - name: Generate canonical OpenAPI contract
        run: python scripts/generate_openapi.py --output docs/openapi.json
      - name: Commit canonical contract to this branch only
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- docs/openapi.json && {
            echo "docs/openapi.json already canonical"
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/openapi.json
          git commit -m "Procurement: refresh OpenAPI contract"
          git push origin HEAD:hardening/procurement-provenance-matrix-v1
