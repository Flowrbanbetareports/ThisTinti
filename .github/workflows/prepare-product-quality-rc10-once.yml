name: Prepare Product Quality RC10 Once

on:
  push:
    branches:
      - agent/product-quality-pass
    paths:
      - .github/workflows/prepare-product-quality-rc10-once.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      THISTINTI_ENV: test
      THISTINTI_DATABASE_URL: sqlite:///./product-quality-rc10.db
      THISTINTI_SECRET_KEY: product-quality-rc10-secret-more-than-thirty-two-characters
      THISTINTI_AUTO_CREATE_SCHEMA: "false"
      THISTINTI_ALLOW_REGISTRATION: "true"
      THISTINTI_SECURE_COOKIES: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: agent/product-quality-pass
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements-dev.txt
      - name: Apply coherent RC10 identity and public wording
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          old = "3.4.0-alpha.7-rc.9"
          new = "3.4.0-alpha.7-rc.10"

          def replace_one(path_name: str, source: str, target: str) -> None:
              path = Path(path_name)
              text = path.read_text(encoding="utf-8")
              count = text.count(source)
              if count != 1:
                  raise SystemExit(f"{path_name}: expected one occurrence of {source!r}, found {count}")
              path.write_text(text.replace(source, target, 1), encoding="utf-8")

          replace_one("app/version.py", f'RELEASE_VERSION = "{old}"', f'RELEASE_VERSION = "{new}"')
          replace_one("pyproject.toml", 'version = "3.4.0a7+rc.9"', 'version = "3.4.0a7+rc.10"')
          replace_one("app/static/app.js", f"UI_VERSION = '{old}'", f"UI_VERSION = '{new}'")
          replace_one("tests/test_rebrand.py", f'RELEASE_VERSION == "{old}"', f'RELEASE_VERSION == "{new}"')
          replace_one("tests/test_simplified_experience.py", f"UI_VERSION = '{old}'", f"UI_VERSION = '{new}'")
          replace_one("installer/windows/ThisTinti.iss", f'#define MyAppVersion "{old}"', f'#define MyAppVersion "{new}"')
          replace_one("installer/windows/ThisTinti.iss", "VersionInfoVersion=3.4.0.15", "VersionInfoVersion=3.4.0.16")

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          source = f"""Versione di sviluppo: **{old} — candidata interna non pubblicata**.\n\nUltima versione pubblica immutabile: **3.4.0-alpha.7-rc.8 — Public Preview**. La candidata interna aggiunge estrazione prudente delle righe da PDF OCR etichettati, controllo tra totale sorgente e totale ricalcolato e workflow pilot esclusivamente locale.\n\nQuesta preview conserva il motore documentale esistente e offre due distribuzioni gratuite: una Local Edition per singola postazione e una Self-Hosted Reference Edition con PostgreSQL, worker scalabili, TLS, scanner malware e strumenti operativi per team tecnici.\n\nLa candidata è adatta a sviluppo, dimostrazioni e **pilot controllati con documenti autorizzati e anonimizzati**. La RC8 mantiene la validazione numerica fail-closed, le evidenze apribili fino all’originale, il centro attività persistente e i collegamenti manuali correggibili, aggiungendo una schermata **Diagnostica** nell’app. Da qui l’utente può verificare servizio, versione, sessione, dati e integrità numerica, quindi scaricare un verbale JSON senza terminale, telemetria o servizi esterni. I test Chromium continuano a usare API, database e worker reali. La beta validata richiede ancora pilot reale, collaudo manuale Windows/accessibilità e revisioni indipendenti.\n"""
          target = f"""Versione di sviluppo: **{new} — candidata interna di qualità prodotto**.\n\nUltima versione pubblica immutabile: **{old} — Public Preview**. La RC9 aggiunge estrazione prudente delle righe da PDF OCR etichettati, controllo tra totale sorgente e totale ricalcolato e workflow pilot esclusivamente locale.\n\nLa candidata RC10 migliora chiarezza, gerarchia e coerenza dell’interfaccia: traduce gli identificatori tecnici, elimina decimali inutili, presenta il rischio come priorità di controllo, compatta gli avvisi ripetitivi, separa meglio gli strumenti avanzati e rende più leggibili attività e audit. Non aggiunge azioni economiche autonome né comunicazioni esterne.\n\nThisTinti offre due distribuzioni gratuite: una Local Edition per singola postazione e una Self-Hosted Reference Edition con PostgreSQL, worker scalabili, TLS, scanner malware e strumenti operativi per team tecnici. È adatto a sviluppo, dimostrazioni e **pilot controllati con documenti autorizzati e anonimizzati**. La beta validata richiede ancora pilot reale, collaudo manuale con tecnologie assistive e revisioni indipendenti.\n"""
          if text.count(source) != 1:
              raise SystemExit("README release status block not found exactly once")
          readme.write_text(text.replace(source, target, 1), encoding="utf-8")

          notes = Path("RELEASE_NOTES.md")
          text = notes.read_text(encoding="utf-8")
          if not text.startswith(f"# {old}"):
              raise SystemExit("Unexpected RELEASE_NOTES heading")
          text = text.replace(
              f"# {old} — OCR strutturato e pilot esclusivamente locale (non pubblicata)",
              f"# {old} — OCR strutturato e pilot esclusivamente locale",
              1,
          )
          text = text.replace(
              "- questa è un’identità di sviluppo interna: nessun asset RC8 viene sostituito e nessuna RC9 viene pubblicata automaticamente.",
              "- pubblicata come Public Preview immutabile dopo i gate completi sul commit candidato e sull’installer Windows verificato.",
              1,
          )
          intro = f"""# {new} — qualità del prodotto e linguaggio operativo (candidata interna)\n\n- identificatori tecnici, campi, stati e tipi di anomalia vengono tradotti in italiano comprensibile;\n- quantità e percentuali non mostrano più zeri decimali inutili;\n- il punteggio di rischio viene presentato come priorità di controllo e l’indice tecnico resta secondario e non probabilistico;\n- l’avviso di uso supervisionato è compatto ma sempre disponibile;\n- Regole proposte, Validation Lab e Audit assumono nomi e spiegazioni più vicini al loro scopo reale;\n- il pulsante demo scompare dopo che esistono documenti e la pagina Attività distingue elaborazioni persistenti dagli altri eventi applicativi;\n- i payload di audit restano disponibili dietro un dettaglio tecnico richiudibile;\n- la nuova presentazione è isolata dal core di sicurezza, non usa servizi esterni e non invia messaggi;\n- un controllo Chromium reale verifica gerarchia, terminologia, numeri, rischio, audit e visibilità della demo;\n- un gate impedisce ai moduli già monolitici di continuare a crescere senza estrazione;\n- RC9 resta la Public Preview immutabile finché RC10 non supera tutti i gate e viene pubblicata separatamente.\n\n"""
          notes.write_text(intro + text, encoding="utf-8")

          roadmap = Path("ROADMAP.md")
          text = roadmap.read_text(encoding="utf-8")
          replace = (
              f"## Stato attuale — {old} candidata interna non pubblicata\n\nUltima Public Preview pubblicata e immutabile: `3.4.0-alpha.7-rc.8`.",
              f"## Stato attuale — {new} candidata interna di qualità prodotto\n\nUltima Public Preview pubblicata e immutabile: `{old}`.",
          )
          if text.count(replace[0]) != 1:
              raise SystemExit("ROADMAP current state not found exactly once")
          text = text.replace(replace[0], replace[1], 1)
          marker = "- workflow del pilot mantenuto interamente locale, senza contatti o messaggi automatici.\n"
          addition = marker + (
              "- linguaggio operativo ripulito dagli identificatori tecnici visibili;\n"
              "- numeri, priorità di controllo, audit e attività presentati con una gerarchia più professionale;\n"
              "- nuova responsabilità di presentazione estratta dal core frontend;\n"
              "- gate contro l’ulteriore crescita dei moduli monolitici.\n"
          )
          if text.count(marker) != 1:
              raise SystemExit("ROADMAP product marker not found exactly once")
          roadmap.write_text(text.replace(marker, addition, 1), encoding="utf-8")

          beta = Path("docs/BETA_READINESS_STATUS.md")
          text = beta.read_text(encoding="utf-8")
          source = f"ThisTinti è in preparazione interna come `{old}`, non ancora pubblicata. L’ultima Public Preview resta `3.4.0-alpha.7-rc.8`. La base tecnica include:"
          target = f"ThisTinti è in preparazione interna come `{new}`. L’ultima Public Preview pubblicata e immutabile è `{old}`. La base tecnica include:"
          if text.count(source) != 1:
              raise SystemExit("Beta readiness version sentence not found exactly once")
          text = text.replace(source, target, 1)
          marker = "- toolkit pilot locale senza comunicazioni o azioni esterne automatiche.\n"
          addition = marker + (
              "- terminologia operativa, numeri e priorità ripuliti senza alterare i dati o le decisioni umane;\n"
              "- controllo Chromium dedicato alla qualità percepita e alla gerarchia dell’interfaccia;\n"
              "- gate di dimensione per impedire ulteriore crescita dei moduli principali.\n"
          )
          if text.count(marker) != 1:
              raise SystemExit("Beta readiness product marker not found exactly once")
          beta.write_text(text.replace(marker, addition, 1), encoding="utf-8")

          for path_name in ("docs/OPERATIONS.md", "docs/PRODUCTION_READINESS.md", "docs/THREAT_MODEL.md"):
              path = Path(path_name)
              text = path.read_text(encoding="utf-8")
              if old in text.splitlines()[0]:
                  text = text.replace(old, new, 1)
                  if "candidata interna" not in text.splitlines()[0]:
                      text = text.replace("\n", " (candidata interna)\n", 1)
                  path.write_text(text, encoding="utf-8")

          gates = Path("docs/evidence/beta/external-gates.json")
          payload = json.loads(gates.read_text(encoding="utf-8"))
          if payload.get("candidate_version") != old:
              raise SystemExit("Unexpected external-gates candidate version")
          payload["candidate_version"] = new
          gates.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          index = Path("app/static/index.html")
          text = index.read_text(encoding="utf-8")
          replacements = {
              '<button class="active" data-view="dashboard" type="button"><span>◫</span> Panoramica</button>': '<button class="active" data-view="dashboard" type="button"><span>⌂</span> Inizio</button>',
              '<button data-view="chains" type="button"><span>⌘</span> Catene</button>': '<button data-view="chains" type="button"><span>⌘</span> Collegamenti</button>',
              '<button data-view="cases" type="button"><span>△</span> Anomalie</button>': '<button data-view="cases" type="button"><span>△</span> Da controllare</button>',
              '<button data-view="discovery" type="button"><span>✦</span> Regole proposte</button>': '<button data-view="discovery" type="button"><span>✦</span> Controlli proposti</button>',
              '<button data-view="validation" type="button"><span>✓</span> Validation Lab</button>': '<button data-view="validation" type="button"><span>✓</span> Qualità del motore</button>',
              '<button data-view="audit" data-admin-only type="button"><span>◎</span> Audit</button>': '<button data-view="audit" data-admin-only type="button"><span>◎</span> Registro attività</button>',
              '<h2 id="pageTitle">Panoramica</h2>': '<h2 id="pageTitle">Inizio</h2>',
              '<article class="metric-card"><p>Anomalie aperte</p>': '<article class="metric-card"><p>Da controllare</p>',
              '<article class="metric-card"><p>Catene operative</p>': '<article class="metric-card"><p>Collegamenti</p>',
              '<article class="metric-card"><p>Importo potenziale</p>': '<article class="metric-card"><p>Valore da verificare</p>',
              '<div class="panel-heading"><div><h3>Documenti</h3><p>XML/P7M, JSON, CSV, XLSX e PDF testuali.</p>': '<div class="panel-heading"><div><h3>Documenti</h3><p>XML/P7M, JSON, CSV, XLSX, PDF testuali e scansioni assistite.</p>',
              '<div class="panel-heading"><div><h3>Catene operative</h3><p>Collegamenti tra documenti della stessa operazione.</p>': '<div class="panel-heading"><div><h3>Collegamenti</h3><p>Documenti che appartengono o potrebbero appartenere alla stessa operazione.</p>',
              '<div class="heading-title-row"><h3>Anomalie</h3>': '<div class="heading-title-row"><h3>Da controllare</h3>',
              '<div class="panel-heading"><div><h3>Regole proposte</h3><p>Lo stato deriva da soglie configurabili. Le regole possono essere controllate, confermate o disattivate.</p>': '<div class="panel-heading"><div><h3>Controlli proposti</h3><p>Controlli spiegabili che possono essere verificati, confermati, rifiutati o disattivati.</p>',
              '<article class="metric-card"><p>Precisione</p>': '<article class="metric-card"><p>Segnalazioni corrette</p>',
              '<article class="metric-card"><p>Recall</p>': '<article class="metric-card"><p>Anomalie trovate</p>',
              '<article class="metric-card"><p>F1</p>': '<article class="metric-card"><p>Equilibrio complessivo</p>',
              '<article class="metric-card"><p>Gate rilascio</p>': '<article class="metric-card"><p>Controllo rilascio</p>',
              '<div class="panel-heading"><div><h3>Audit log</h3><p>Azioni e modifiche registrate in ordine cronologico.</p>': '<div class="panel-heading"><div><h3>Registro attività</h3><p>Azioni e modifiche registrate in ordine cronologico, con dettagli tecnici richiudibili.</p>',
          }
          for source, target in replacements.items():
              if text.count(source) != 1:
                  raise SystemExit(f"index.html: expected one occurrence of {source!r}, found {text.count(source)}")
              text = text.replace(source, target, 1)
          index.write_text(text, encoding="utf-8")

          Path("docs/RC10_INTERNAL_CANDIDATE.md").write_text(
              f"""# RC10 internal candidate\n\nVersion: `{new}`.\n\nRC10 is the product-quality candidate after the immutable `{old}` Public Preview. It focuses on terminology, numerical presentation, information hierarchy, advanced-tool disclosure, activity context and frontend modularity.\n\nIt does not publish itself, replace RC9 assets, contact external parties or change the rule that every document finding requires human verification.\n\n## Required gates\n\n- complete repository verification and minimum 90% coverage;\n- Chromium product-polish, onboarding, evidence, recovery, links and diagnostics checks;\n- apparel OCR benchmark and local pilot toolkit;\n- PostgreSQL and self-hosted proofs;\n- Windows build, upgrade, installed diagnostics, uninstall and data-preservation lifecycle;\n- immutable RC9 publication evidence preserved until a separate RC10 publication request.\n""",
              encoding="utf-8",
          )
          PY
          python scripts/generate_openapi.py
          python scripts/generate_sbom.py
          python -m ruff format app tests scripts migrations run_thistinti.py
          node --check app/static/app.js
          node --check app/static/product-polish.js
          python scripts/check_module_boundaries.py
          python scripts/check_release_consistency.py
          python -m pytest -q \
            tests/test_rebrand.py \
            tests/test_simplified_experience.py \
            tests/test_product_quality_pass.py \
            tests/test_module_boundaries.py
          python -m ruff check app tests scripts migrations run_thistinti.py
          git diff --check
      - name: Commit coherent RC10 candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/version.py \
            app/static/app.js \
            app/static/index.html \
            pyproject.toml \
            installer/windows/ThisTinti.iss \
            tests/test_rebrand.py \
            tests/test_simplified_experience.py \
            README.md \
            RELEASE_NOTES.md \
            ROADMAP.md \
            docs/BETA_READINESS_STATUS.md \
            docs/OPERATIONS.md \
            docs/PRODUCTION_READINESS.md \
            docs/THREAT_MODEL.md \
            docs/evidence/beta/external-gates.json \
            docs/openapi.json \
            docs/sbom.cdx.json \
            docs/RC10_INTERNAL_CANDIDATE.md
          git commit -m "Set product quality candidate to RC10"
          git push origin HEAD:agent/product-quality-pass
