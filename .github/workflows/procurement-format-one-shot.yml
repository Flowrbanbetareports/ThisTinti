name: Procurement Format One-Shot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/procurement-format-one-shot.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install exact formatter
        run: pip install ruff==0.15.22
      - name: Format and verify Procurement pilot files
        run: |
          ruff format \
            scripts/procurement_pilot/common.py \
            scripts/procurement_pilot/freeze.py \
            scripts/procurement_pilot/ground_truth.py \
            scripts/procurement_pilot/workspace.py \
            tests/test_procurement_pilot_protocol.py
          ruff format --check \
            scripts/procurement_pilot/common.py \
            scripts/procurement_pilot/freeze.py \
            scripts/procurement_pilot/ground_truth.py \
            scripts/procurement_pilot/workspace.py \
            tests/test_procurement_pilot_protocol.py
      - name: Commit only formatter output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ThisTinti"
          git config user.email "flowrbanbetareports@gmail.com"
          git add \
            scripts/procurement_pilot/common.py \
            scripts/procurement_pilot/freeze.py \
            scripts/procurement_pilot/ground_truth.py \
            scripts/procurement_pilot/workspace.py \
            tests/test_procurement_pilot_protocol.py
          if git diff --cached --quiet; then
            echo "No formatter changes to commit."
            exit 0
          fi
          git commit -m "style: format Procurement pilot toolkit"
          git push origin HEAD:main
