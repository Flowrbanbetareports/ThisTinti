name: Publish Public Preview Release

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full main-branch commit SHA that passed every release gate
        required: true
        type: string
      windows_run_id:
        description: Successful main-branch Build Windows Free Download run ID for target_sha
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - builds/public-preview-request.json

permissions:
  actions: read
  attestations: read
  contents: write

concurrency:
  group: thistinti-public-preview-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
          show-progress: false

      - name: Resolve the reviewed publication request
        shell: bash
        env:
          DISPATCH_TARGET_SHA: ${{ inputs.target_sha }}
          DISPATCH_WINDOWS_RUN_ID: ${{ inputs.windows_run_id }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            TARGET_SHA="$(python -c 'import json; print(json.load(open("builds/public-preview-request.json", encoding="utf-8"))["target_sha"])')"
            WINDOWS_RUN_ID="$(python -c 'import json; print(json.load(open("builds/public-preview-request.json", encoding="utf-8"))["windows_run_id"])')"
          else
            TARGET_SHA="$DISPATCH_TARGET_SHA"
            WINDOWS_RUN_ID="$DISPATCH_WINDOWS_RUN_ID"
          fi
          {
            echo "TARGET_SHA=$TARGET_SHA"
            echo "WINDOWS_RUN_ID=$WINDOWS_RUN_ID"
          } >> "$GITHUB_ENV"
          git checkout --detach "$TARGET_SHA"

      - name: Resolve and constrain the release source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "target_sha must be a full commit" >&2; exit 1; }
          [[ "$WINDOWS_RUN_ID" =~ ^[0-9]+$ ]] || { echo "windows_run_id must be numeric" >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$TARGET_SHA" origin/main
          VERSION="$(python -c 'from app.version import RELEASE_VERSION; print(RELEASE_VERSION)')"
          SOURCE_TREE="$(git rev-parse "${TARGET_SHA}^{tree}")"
          {
            echo "VERSION=$VERSION"
            echo "TAG=v$VERSION"
            echo "SOURCE_TREE=$SOURCE_TREE"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Re-run the complete release gate on the exact source
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y openssl poppler-utils tesseract-ocr tesseract-ocr-eng tesseract-ocr-ita
          pip install -r requirements-dev.txt
          make verify

      - name: Require green exact-commit workflows and Windows build
        shell: bash
        run: |
          python scripts/verify_publish_candidate.py \
            --repository "$GITHUB_REPOSITORY" \
            --target-sha "$TARGET_SHA" \
            --windows-run-id "$WINDOWS_RUN_ID" \
            --output candidate.json

      - name: Download the exact verified Windows artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_NAME="$(python -c 'import json; print(json.load(open("candidate.json", encoding="utf-8"))["artifact_name"])')"
          echo "name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          gh run download "$WINDOWS_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir dist

      - name: Verify checksums, smoke reports and source provenance
        shell: bash
        run: |
          python scripts/verify_release_artifact.py \
            --directory dist \
            --expected-version "$VERSION" \
            --expected-commit "$TARGET_SHA" \
            --expected-tree "$SOURCE_TREE"
          gh attestation verify "dist/ThisTinti-Setup-$VERSION-x64.exe" --repo "$GITHUB_REPOSITORY"
          gh attestation verify "dist/ThisTinti-Portable-$VERSION-x64.zip" --repo "$GITHUB_REPOSITORY"
          gh attestation verify "dist/ThisTinti-$VERSION-self-hosted-source.zip" --repo "$GITHUB_REPOSITORY"

      - name: Refuse replacement or reuse the exact immutable release
        shell: bash
        run: |
          set -euo pipefail
          TAG_EXISTS=false
          RELEASE_EXISTS=false
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1 && TAG_EXISTS=true
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && RELEASE_EXISTS=true
          if [[ "$TAG_EXISTS" != "$RELEASE_EXISTS" ]]; then
            echo "Tag and release state differ; refusing publication" >&2
            exit 1
          fi
          if [[ "$RELEASE_EXISTS" == true ]]; then
            EXISTING_TARGET="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)"
            test "$EXISTING_TARGET" = "$TARGET_SHA" || { echo "Existing release targets another commit" >&2; exit 1; }
            echo "RELEASE_ALREADY_EXISTS=true" >> "$GITHUB_ENV"
          else
            echo "RELEASE_ALREADY_EXISTS=false" >> "$GITHUB_ENV"
          fi

      - name: Prepare truthful Public Preview notes
        shell: bash
        run: |
          {
            printf '## ThisTinti %s — Public Preview\n\n' "$VERSION"
            printf 'Workspace locale e supervisionato per riconciliare catene documentali e preparare evidenze di possibili discrepanze.\n\n'
            printf 'Questa è una Public Preview alpha/RC: gli output sono informativi, richiedono verifica sui documenti originali e non certificano documenti né autorizzano decisioni economiche.\n\n'
            printf '### Provenienza verificata\n\n'
            printf -- '- Commit: `%s`\n' "$TARGET_SHA"
            printf -- '- Tree Git: `%s`\n' "$SOURCE_TREE"
            printf -- '- Workflow Windows: `%s`\n\n' "$WINDOWS_RUN_ID"
            printf '### Modifiche\n\n'
            cat RELEASE_NOTES.md
            printf '\n### Firma Windows\n\n'
            printf 'L’installer non è ancora firmato Authenticode. Verificare SHA-256 e attestazione GitHub; Windows può mostrare “Editore sconosciuto”.\n'
          } > public-preview-notes.md

      - name: Publish immutable prerelease assets
        if: env.RELEASE_ALREADY_EXISTS != 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "ThisTinti $VERSION — Public Preview" \
            --notes-file public-preview-notes.md \
            --prerelease

      - name: Generate immutable publication evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publication-evidence
          python scripts/record_github_publication.py \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --source-commit "$TARGET_SHA" \
            --source-tree "$SOURCE_TREE" \
            --artifact-directory dist \
            --release-output publication-evidence/release-latest.json \
            --publication-output publication-evidence/publication-latest.json

      - name: Upload publication evidence without mutating main
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-preview-publication-${{ env.TARGET_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: publication-evidence/
          retention-days: 90
