name: Finalize PR48 RC6 Contracts

on:
  pull_request_target:
    types: [reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.event.pull_request.number == 48 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release/finalize-3.4.0-alpha.7-rc.6'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: release/finalize-3.4.0-alpha.7-rc.6
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
      - name: Install locked dependencies
        run: pip install -r requirements-dev.txt
      - name: Align supervised product language
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/static/app-core.js')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'Simula approvazione': 'Stima rischio della catena',
              '<p>Rischio preventivo</p>': '<p>Stima euristica del rischio</p>',
              '<p>Tripla verifica</p>': '<p>Controllo incrociato</p>',
              '<p>Conformità processo</p>': '<p>Somiglianza al processo osservato</p>',
              '<h3>Sentinel Twin</h3>': '<h3>Documenti attesi</h3>',
              '<strong>Self-red-team:': '<strong>Test sintetico degli errori:',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Marker not found: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          node --check app/static/app-core.js
      - name: Regenerate release contracts
        run: |
          python scripts/generate_openapi.py
          python scripts/generate_sbom.py
      - name: Verify consistency and focused tests
        run: |
          pytest -q tests/test_release_integrity.py tests/test_simplified_experience.py
          python scripts/check_release_consistency.py
          git diff --check
      - name: Commit finalized RC6 metadata
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/static/app-core.js docs/openapi.json docs/sbom.cdx.json
          git commit -m 'Finalize RC6 contracts and supervised product language'
          git push origin HEAD:release/finalize-3.4.0-alpha.7-rc.6
