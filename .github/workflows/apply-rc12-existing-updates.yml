name: Apply RC12 Existing Updates

on:
  push:
    branches: [agent/rc12-light-commercial-readiness]
    paths:
      - ".github/workflows/apply-rc12-existing-updates.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/apply-rc12-existing-updates.yml"

permissions:
  contents: write

concurrency:
  group: apply-rc12-existing-updates
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: agent/rc12-light-commercial-readiness
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Apply reviewed RC12 updates
        run: python scripts/apply_rc12_existing_updates.py
      - name: Format and lint changed Python
        run: |
          ruff format \
            app/main.py \
            app/services/commercial.py \
            scripts/check_commercial_readiness_browser.py \
            tests/test_commercial_readiness.py \
            tests/test_release_integrity.py
          ruff check \
            app/main.py \
            app/services/commercial.py \
            scripts/check_commercial_readiness_browser.py \
            tests/test_commercial_readiness.py \
            tests/test_release_integrity.py
      - name: Regenerate contracts
        run: |
          python scripts/generate_openapi.py
          python scripts/generate_sbom.py
      - name: Validate JavaScript and focused regressions
        run: |
          node --check app/static/commercial.js
          node --check site/project.js
          pytest -q \
            tests/test_commercial_readiness.py \
            tests/test_local_privacy.py \
            tests/test_release_integrity.py \
            tests/test_rebrand.py \
            tests/test_simplified_experience.py
      - name: Remove one-shot migration files
        run: |
          rm scripts/apply_rc12_existing_updates.py
          rm .github/workflows/apply-rc12-existing-updates.yml
      - name: Commit integrated candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare RC12 light commercial readiness"
          git push origin HEAD:agent/rc12-light-commercial-readiness
