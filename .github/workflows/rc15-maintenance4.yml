name: RC15 Maintenance 4
on:
  push:
    branches: [rc15/pilot-ready]
permissions:
  contents: write
jobs:
  maintain:
    if: ${{ !contains(github.event.head_commit.message, '[rc15-core-done]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: rc15/pilot-ready
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Apply approved RC15 refinements and split pilot service
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          source = Path('.github/workflows/rc15-maintenance2.yml')
          lines = source.read_text(encoding='utf-8').splitlines()
          def extract(step_name):
              start = next(i for i, line in enumerate(lines) if line.strip() == f'- name: {step_name}')
              run = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'run: |')
              block = []
              for line in lines[run + 1:]:
                  if line.startswith('      - name:'):
                      break
                  block.append(line[10:] if line.startswith('          ') else line)
              return '\n'.join(block) + '\n'
          for name in ('Apply RC15 refinements', 'Add focused RC15 tests'):
              subprocess.run(['bash', '-euo', 'pipefail', '-c', extract(name)], check=True)

          service = Path('app/services/rc15.py')
          text = service.read_text(encoding='utf-8')
          text = text.replace('from .ingestion import document_parse_error_detail, reprocess_document', 'from .ingestion import document_parse_error_detail')
          marker = '\ndef create_pilot(\n'
          if marker not in text:
              raise SystemExit('create_pilot split marker missing')
          head, suffix = text.split(marker, 1)
          service.write_text(head.rstrip() + '\n', encoding='utf-8')
          pilot_header = '''from __future__ import annotations\n\nfrom collections import Counter\nfrom datetime import date\nfrom statistics import mean\nfrom typing import Any\n\nfrom sqlalchemy import func, select\nfrom sqlalchemy.orm import Session\n\nfrom ..audit import add_audit\nfrom ..models import DiscrepancyCase, utcnow\nfrom ..rc15_models import RC15CompanyProfileVersion, RC15PilotCase, RC15PilotWorkspace, RC15Practice\nfrom ..version import RELEASE_VERSION\nfrom .rc15 import (\n    _canonical_json,\n    _json,\n    _practice_documents,\n    _sha,\n    company_profile_payload,\n    ensure_company_profile,\n)\n\n\n'''
          Path('app/services/rc15_pilot.py').write_text(pilot_header + 'def create_pilot(\n' + suffix, encoding='utf-8')

          api = Path('app/rc15_api.py')
          api_text = api.read_text(encoding='utf-8')
          pilot_names = [
              'add_pilot_practice', 'create_pilot', 'freeze_pilot', 'pilot_payload',
              'render_pilot_markdown', 'run_pilot', 'update_pilot_case'
          ]
          for name in pilot_names:
              api_text = api_text.replace(f'    {name},\n', '')
          anchor = 'from .services.rc15 import (\n'
          if anchor not in api_text:
              raise SystemExit('rc15 service import anchor missing')
          # add independent pilot service import after the rc15 import block closes, using a safe nearby import anchor
          target = 'from .version import RELEASE_VERSION\n'
          pilot_import = 'from .services.rc15_pilot import (\n' + ''.join(f'    {name},\n' for name in pilot_names) + ')\n'
          api_text = api_text.replace(target, pilot_import + target)
          api.write_text(api_text, encoding='utf-8')
          PY
      - name: Validate modular core
        shell: bash
        run: |
          pip install -r requirements-dev.txt
          ruff format app/rc15_api.py app/services/rc15.py app/services/rc15_pilot.py app/rc15_models.py migrations/versions/e15c0a7f4d21_add_rc15_pilot_ready.py tests/test_rc15_pilot_ready.py tests/test_simplified_experience.py
          ruff check --fix app/rc15_api.py app/services/rc15.py app/services/rc15_pilot.py app/rc15_models.py tests/test_rc15_pilot_ready.py
          ruff check app/rc15_api.py app/services/rc15.py app/services/rc15_pilot.py app/rc15_models.py tests/test_rc15_pilot_ready.py
          pytest -q tests/test_rc15_pilot_ready.py tests/test_module_boundaries.py
      - name: Commit modular core and remove helpers
        shell: bash
        run: |
          rm -f .github/workflows/rc15-maintenance.yml .github/workflows/rc15-maintenance2.yml .github/workflows/rc15-maintenance3.yml .github/workflows/rc15-maintenance4.yml
          git config user.name "ThisTinti"
          git config user.email "flowrbanbetareports@gmail.com"
          git add -A
          git commit -m "RC15: harden and modularize pilot-ready core [rc15-core-done]"
          git push origin HEAD:rc15/pilot-ready
