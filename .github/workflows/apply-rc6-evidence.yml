name: Apply RC6 Evidence Workflow Patch

on:
  push:
    branches:
      - codex/rc6-evidence-critical
    paths:
      - ".automation/rc6-evidence.patch.gz.b64"
      - ".github/workflows/apply-rc6-evidence.yml"

permissions:
  contents: write

concurrency:
  group: apply-rc6-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: codex/rc6-evidence-critical
          fetch-depth: 0
      - name: Apply verified patch and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .automation/rc6-evidence.patch.gz.b64 | gzip --decompress > /tmp/rc6-evidence.patch
          git apply --index --whitespace=nowarn /tmp/rc6-evidence.patch
          rm -f .automation/rc6-evidence.patch.gz.b64 .github/workflows/apply-rc6-evidence.yml
          rmdir .automation 2>/dev/null || true
          git add -A
          git diff --cached --stat
      - name: Commit RC6 evidence workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "RC6 Evidence Workflow: expose original evidence and prioritize critical cases"
          git push origin HEAD:codex/rc6-evidence-critical
