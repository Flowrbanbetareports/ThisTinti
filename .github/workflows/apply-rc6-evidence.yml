name: Apply RC6 Evidence Workflow Patch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-rc6-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'codex/rc6-evidence-critical'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: codex/rc6-evidence-critical
          fetch-depth: 0
      - name: Apply verified product patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .automation/rc6-evidence.patch.gz.b64 | gzip --decompress > /tmp/rc6-evidence.patch
          git apply --index --ignore-space-change --ignore-whitespace --whitespace=nowarn /tmp/rc6-evidence.patch
          # Workflow files are updated separately through the authorized GitHub connector.
          git restore --source=HEAD --staged --worktree .github/workflows/simplified-experience.yml
          git diff --cached --stat
      - name: Commit product code and tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "RC6 Evidence Workflow: expose original evidence and prioritize critical cases"
          git push origin HEAD:codex/rc6-evidence-critical
