name: RC15 OpenAPI Response Fix

on:
  push:
    branches:
      - rc15/pilot-ready
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rc15-openapi-response-fix
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: rc15/pilot-ready
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install generator dependencies
        run: pip install -r requirements-dev.txt
      - name: Describe non-JSON RC15 responses explicitly
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/rc15_api.py')
          text = path.read_text(encoding='utf-8')

          export_old = '@router.get("/practices/{practice_id}/export")\n'
          export_new = '''@router.get(\n    "/practices/{practice_id}/export",\n    response_class=Response,\n    responses={\n        200: {\n            "description": "Archivio ZIP verificabile della pratica",\n            "content": {"application/zip": {"schema": {"type": "string", "format": "binary"}}},\n        }\n    },\n)\n'''
          if export_old not in text and export_new not in text:
              raise SystemExit('practice export decorator not found')
          text = text.replace(export_old, export_new, 1)

          report_old = '@router.get("/pilots/{pilot_id}/report")\n'
          report_new = '''@router.get(\n    "/pilots/{pilot_id}/report",\n    response_class=Response,\n    responses={\n        200: {\n            "description": "Rapporto pilot redatto in JSON o Markdown",\n            "content": {\n                "application/json": {"schema": {"type": "object", "additionalProperties": True}},\n                "text/markdown": {"schema": {"type": "string"}},\n            },\n        }\n    },\n)\n'''
          if report_old not in text and report_new not in text:
              raise SystemExit('pilot report decorator not found')
          text = text.replace(report_old, report_new, 1)

          path.write_text(text, encoding='utf-8')
          PY
          ruff format app/rc15_api.py
          ruff format --check app/rc15_api.py
          python scripts/generate_openapi.py --output docs/openapi.json
          git diff --check
      - name: Diagnose extended regression explicitly
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: pytest -vv tests/test_extended.py --tb=long
      - name: Verify OpenAPI contract
        run: python scripts/verify_release.py
      - name: Commit fix when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app/rc15_api.py docs/openapi.json; then
            echo "OpenAPI response contracts already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/rc15_api.py docs/openapi.json
          git commit -m "fix(rc15): describe downloadable response contracts"
          git push origin HEAD:rc15/pilot-ready
