name: Refresh RC11 Contracts on PR

on:
  pull_request:
    branches: [main]
    paths:
      - app/main.py
      - app/schemas.py
      - app/services/operational.py
      - docs/openapi.json
      - docs/sbom.cdx.json
      - .github/workflows/refresh-rc11-contracts-on-pr.yml

permissions:
  contents: write

concurrency:
  group: rc11-contracts-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: agent/rc11-operational-center
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Regenerate committed API and dependency contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements-dev.txt
          python scripts/generate_openapi.py
          python scripts/generate_sbom.py
          python scripts/check_release_consistency.py
          python -m pytest -q tests/test_release_integrity.py tests/test_operational_center.py tests/test_operational_center_assets.py
          git diff --check
      - name: Commit generated contracts and remove this helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/refresh-rc11-contracts-on-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/openapi.json docs/sbom.cdx.json
          git commit -m "Refresh RC11 API and dependency contracts"
          git push origin HEAD:agent/rc11-operational-center
