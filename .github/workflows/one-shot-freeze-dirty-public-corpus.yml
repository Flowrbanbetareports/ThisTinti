name: One-shot freeze dirty public corpus

on:
  push:
    branches:
      - benchmark/dirty-public-corpus-22
    paths:
      - .github/workflows/one-shot-freeze-dirty-public-corpus.yml

permissions:
  contents: write

jobs:
  freeze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: benchmark/dirty-public-corpus-22
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Freeze corpus, hashes and semantic truth
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          HASHES = {
              "lpl-penlink-quote-01487": "d5ceef2dfd13fc8fe205754b1e8ecaf787d5f6721ee1e8ef87fa27ee3c2c24e0",
              "lpl-penlink-quote-04689": "7df49881ff272e22e2048b38d726b71f805baa9aa4014ed92328cafbc7123e98",
              "lpl-cook-county-cellebrite": "72ff43f69f834804dacf89ae0bd6009533349f92c5353519ca672bb57b59afee",
              "lpl-cellebrite-foia-15-3895": "d899c565ba7c81b4626239947d6c9691279f29cd9f10d985e1f3bbb7ea972d06",
              "lpl-cpd-foia-15-2549": "b7464397f0f9aa22a0e96860309167b6a6f90416d8ff09a31fe1befb83bfc9a4",
              "lpl-cpd-checks-15-4684": "881c052ec600df63afeba4b439271e33b3f0a99ba1a94d812f20e48818ca745a",
              "lpl-cpd-checks-15-5293": "b9196b778c3c9e9dcb8699bc5e64caefd1b76603db68ef2a2ffe97ed1d6fb574",
              "lpl-cpd-checks-15-5691": "4c59ad452058652aa017ab7da62db0d01bf7a28a0d73dea933aed02a21945066",
              "lpl-cpd-foia-15-6571": "25a0a6d1a444fb78264e5a07e501f8b8cdbf3ee3836bfa40c65f67547eb2bdf7",
              "lpl-cpd-checks-15-6690": "4a14482d6489e65e8dd95b94d8247a5c7a4196808b815ba1e087485ec7555690",
              "lpl-cpd-checks-15-6708": "3d987120151ddcd68a27d3b25df14b2b24a2becd1524ff281410796fc944c24f",
              "lpl-cpd-checks-15-7069": "b78231e7cbef9c5add5e822b5297ad6829bc2d860b976a6d7bbe56bcc7c5836b",
              "lpl-cpd-imsi-response": "5b7e9a70718fb2b6680769dec469570d5e31c3a4c0ce336ae161cb4f3b1dc0c8",
              "lpl-cpd-imsi-hailstorm": "5252cea9cb2d850e987e8681badea7a4c153cce1c55e883119ebf584aa49c908",
              "lpl-ccso-money-laundering": "7c3022e6716aa137ede3f77a926d127fd704916e94a41598d60bf3bbd6d9e522",
              "vida-hp001-at-be": "32bba956c43b2a0d494b282c894d3df4974758972f0a7e995bccd5c0af7f002f",
              "vida-hp002-at-no": "83e7914ea273bfa96909c683adc0297cbcac94843e5bad536454f021035840dd",
              "vida-hp006-at-be": "d97a750b68d4229325ef49c20a50222c68fb14a17199376785df6cc64b82f0de",
              "vida-hp008-at-be": "99483c5566f8c8ebbae890ece86a08a4d7e5b123d0015e066ef85ecf4da47e22",
              "peppol-base-example": "1b7cc3ff1834c8963f2c93f30f171b58002cbf0b2c52dc8765e7e83aebb9f7c9",
              "en16931-creditnote1": "911d7ac2cb4fa72d21331c76914468e7d94eda03629e0def75c64ab18e3e9dce",
              "en16931-negative-example": "8563b0537944baa16b85980e6bf95cb95c22df71cde946952d22c2a90e7315a7",
          }

          def write_json(path: Path, payload: dict) -> None:
              path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          manifest_path = Path("samples/dirty_public_corpus_22.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          ids = {source["id"] for source in manifest["sources"]}
          if ids != set(HASHES):
              raise SystemExit(f"hash map/source IDs differ: missing={ids - set(HASHES)} extra={set(HASHES) - ids}")
          manifest["version"] = "1.0-frozen"
          manifest["frozen"] = True
          for source in manifest["sources"]:
              source["sha256"] = HASHES[source["id"]]
          write_json(manifest_path, manifest)

          truth_path = Path("samples/dirty_public_corpus_22_ground_truth.json")
          truth = json.loads(truth_path.read_text(encoding="utf-8"))
          if set(truth.get("cases", {})) != {
              "lpl-penlink-quote-01487",
              "lpl-penlink-quote-04689",
              "vida-hp001-at-be",
              "vida-hp002-at-no",
              "vida-hp006-at-be",
              "vida-hp008-at-be",
              "peppol-base-example",
              "en16931-creditnote1",
              "en16931-negative-example",
          }:
              raise SystemExit("semantic ground-truth case set changed before freeze")
          truth["version"] = "1.0-frozen"
          truth["frozen"] = True
          write_json(truth_path, truth)

          runner_path = Path("scripts/run_dirty_public_corpus.py")
          runner = runner_path.read_text(encoding="utf-8")

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, got {count}")
              return text.replace(old, new, 1)

          runner = replace_once(runner, "import json\nimport sys", "import json\nimport re\nimport sys", "runner import")
          runner = replace_once(
              runner,
              "MAX_SOURCE_BYTES = 25 * 1024 * 1024\n",
              "MAX_SOURCE_BYTES = 25 * 1024 * 1024\nSHA256_PATTERN = re.compile(r\"^[0-9a-f]{64}$\")\n",
              "runner sha pattern",
          )
          runner = replace_once(
              runner,
              '        "expectation_mode": outcome,\n        "source_truth": expected.get("source_truth"),',
              '        "expectation_mode": outcome,\n        "expected_sha256": source.get("sha256"),\n        "integrity_passed": None,\n        "source_truth": expected.get("source_truth"),',
              "runner result integrity fields",
          )
          runner = replace_once(
              runner,
              '    result["observed_sha256"] = sha256_bytes(payload)\n    result["download"] = {"status": "downloaded", **download_metadata}',
              '    result["observed_sha256"] = sha256_bytes(payload)\n    expected_sha256 = result["expected_sha256"]\n    if expected_sha256 is not None:\n        result["integrity_passed"] = result["observed_sha256"] == expected_sha256\n        if not result["integrity_passed"]:\n            result["expectation_failures"].append(\n                f"source SHA-256 expected {expected_sha256}, got {result[\'observed_sha256\']}"\n            )\n    result["download"] = {"status": "downloaded", **download_metadata}',
              "runner integrity comparison",
          )
          runner = replace_once(
              runner,
              '    if len(sources) != 22:\n        raise SystemExit(f"Dirty Public Corpus v1 must contain exactly 22 cases, got {len(sources)}")\n\n    started = time.perf_counter()',
              '    if len(sources) != 22:\n        raise SystemExit(f"Dirty Public Corpus v1 must contain exactly 22 cases, got {len(sources)}")\n\n    frozen = bool(manifest.get("frozen"))\n    if frozen:\n        invalid_hashes = [\n            source["id"]\n            for source in sources\n            if not isinstance(source.get("sha256"), str) or not SHA256_PATTERN.fullmatch(source["sha256"])\n        ]\n        if invalid_hashes:\n            raise SystemExit(f"Frozen corpus requires valid SHA-256 for every source: {invalid_hashes}")\n\n    started = time.perf_counter()',
              "runner frozen validation",
          )
          runner = replace_once(
              runner,
              '    unhandled = parse_status_counts.get("unhandled_exception", 0)\n    assertion_cases = [item for item in cases if item["expectation_mode"] != "characterize"]',
              '    unhandled = parse_status_counts.get("unhandled_exception", 0)\n    integrity_cases = [item for item in cases if item.get("expected_sha256") is not None]\n    integrity_failures = sum(item.get("integrity_passed") is not True for item in integrity_cases)\n    assertion_cases = [item for item in cases if item["expectation_mode"] != "characterize"]',
              "runner integrity metrics",
          )
          runner = replace_once(
              runner,
              '    frozen = bool(manifest.get("frozen"))\n    reproducible = download_failures == 0 and unhandled == 0',
              '    reproducible = download_failures == 0 and unhandled == 0 and integrity_failures == 0',
              "runner reproducible integrity gate",
          )
          runner = replace_once(
              runner,
              '            "unhandled_exceptions": unhandled,\n            "parse_status_counts": dict(parse_status_counts),',
              '            "unhandled_exceptions": unhandled,\n            "source_integrity_checks": len(integrity_cases),\n            "source_integrity_failures": integrity_failures,\n            "parse_status_counts": dict(parse_status_counts),',
              "runner report integrity metrics",
          )
          runner = replace_once(
              runner,
              '- unhandled exceptions: **{metrics["unhandled_exceptions"]}**\n- parsed:',
              '- unhandled exceptions: **{metrics["unhandled_exceptions"]}**\n- source-integrity checks: **{metrics["source_integrity_checks"]}**\n- source-integrity failures: **{metrics["source_integrity_failures"]}**\n- parsed:',
              "runner markdown integrity metrics",
          )
          runner_path.write_text(runner, encoding="utf-8")

          tests_path = Path("tests/test_dirty_public_corpus.py")
          tests = tests_path.read_text(encoding="utf-8")
          tests = replace_once(
              tests,
              'MANIFEST = ROOT / "samples" / "dirty_public_corpus_22.json"\n',
              'MANIFEST = ROOT / "samples" / "dirty_public_corpus_22.json"\nGROUND_TRUTH = ROOT / "samples" / "dirty_public_corpus_22_ground_truth.json"\n',
              "test truth path",
          )
          if "def test_frozen_corpus_has_exact_sha256_and_matching_truth_version" in tests:
              raise SystemExit("frozen integrity test already exists")
          tests += '''\n\ndef test_frozen_corpus_has_exact_sha256_and_matching_truth_version() -> None:\n    manifest = load_manifest()\n    truth = json.loads(GROUND_TRUTH.read_text(encoding="utf-8"))\n    sha256 = re.compile(r"^[0-9a-f]{64}$")\n    assert manifest["frozen"] is True\n    assert truth["frozen"] is True\n    assert manifest["version"] == truth["version"] == "1.0-frozen"\n    assert all(sha256.fullmatch(item.get("sha256", "")) for item in manifest["sources"])\n'''
          tests_path.write_text(tests, encoding="utf-8")

          doc_path = Path("docs/DIRTY_PUBLIC_CORPUS_22.md")
          doc = doc_path.read_text(encoding="utf-8")
          doc = replace_once(
              doc,
              "## Discovery first, frozen gate second",
              "## Discovery and frozen gate",
              "corpus doc section",
          )
          doc = replace_once(
              doc,
              "The initial corpus remains `frozen: false` while its behavior is characterized.",
              "The characterization phase is complete for the pinned 22-file baseline. The manifest and reviewed nine-case semantic ground truth are now `frozen: true`; source SHA-256 integrity is enforced by the corpus runner.",
              "corpus doc frozen state",
          )
          if "## Frozen baseline recorded" not in doc:
              doc += """\n## Frozen baseline recorded\n\nCorpus version `1.0-frozen` pins every one of the 22 upstream payloads by SHA-256 in addition to the immutable upstream Git commit/blob references. The nine independently reviewed semantic cases are frozen under the same version. A changed payload, a failed download, an unhandled parser exception, or a failed frozen assertion now fails the corpus gate. The thirteen mixed-packet cases remain characterization-only and are not promoted to correctness passes.\n"""
          doc_path.write_text(doc, encoding="utf-8")

          evaluation_path = Path("docs/DIRTY_PUBLIC_CORPUS_22_EVALUATION.md")
          evaluation = evaluation_path.read_text(encoding="utf-8")
          if "## Corpus 1 frozen baseline" not in evaluation:
              evaluation += """\n## Corpus 1 frozen baseline\n\nThe branch records Corpus 1 as version `1.0-frozen`: all 22 source payload SHA-256 values are pinned and enforced, and the nine-case semantic ground truth is frozen. This does not convert the thirteen mixed FOIA packets into semantic passes; they remain characterization-only until a document-segmentation layer can support stronger source-based assertions. Corpus 2 remains reserved for a future previously unseen generalization test.\n"""
          evaluation_path.write_text(evaluation, encoding="utf-8")
          PY
      - name: Format and validate changed Python
        run: |
          python -m pip install ruff==0.15.22
          ruff format scripts/run_dirty_public_corpus.py tests/test_dirty_public_corpus.py
          ruff check scripts/run_dirty_public_corpus.py tests/test_dirty_public_corpus.py
          python -m py_compile scripts/run_dirty_public_corpus.py tests/test_dirty_public_corpus.py
      - name: Commit frozen baseline
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add samples/dirty_public_corpus_22.json samples/dirty_public_corpus_22_ground_truth.json scripts/run_dirty_public_corpus.py tests/test_dirty_public_corpus.py docs/DIRTY_PUBLIC_CORPUS_22.md docs/DIRTY_PUBLIC_CORPUS_22_EVALUATION.md
          git diff --cached --check
          git commit -m 'Freeze dirty public corpus evidence baseline'
          git push origin HEAD:benchmark/dirty-public-corpus-22

# One-shot only. Delete this workflow after the frozen-baseline commit lands.
