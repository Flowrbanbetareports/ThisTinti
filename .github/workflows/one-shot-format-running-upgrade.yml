name: One Shot Format Running Upgrade

on:
  push:
    branches:
      - fix/windows-running-upgrade
    paths:
      - ".github/workflows/one-shot-format-running-upgrade.yml"
      - "tests/test_windows_running_upgrade.py"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/windows-running-upgrade
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Format exact test file
        run: |
          python -m pip install ruff==0.15.22
          ruff format tests/test_windows_running_upgrade.py
          ruff format --check tests/test_windows_running_upgrade.py
      - name: Commit formatting only
        run: |
          if git diff --quiet -- tests/test_windows_running_upgrade.py; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_windows_running_upgrade.py
          git commit -m "Format Windows running-upgrade test with Ruff"
          git push origin HEAD:fix/windows-running-upgrade
