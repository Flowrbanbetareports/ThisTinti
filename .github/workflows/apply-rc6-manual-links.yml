name: Apply RC6 Manual Links Patch

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".automation/rc6-manual-links.patch.gz.b64"
      - ".automation/rc6-manual-links.patch.gz.b64.part*"
      - ".github/workflows/apply-rc6-manual-links.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-rc6-manual-links-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'codex/rc6-manual-links'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: codex/rc6-manual-links
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Reassemble and apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          cat .automation/rc6-manual-links.patch.gz.b64.part* | base64 --decode | gzip -dc > /tmp/rc6-manual-links.patch
          git apply --check /tmp/rc6-manual-links.patch
          git apply /tmp/rc6-manual-links.patch
      - name: Install locked development dependencies
        run: pip install -r requirements-dev.txt
      - name: Format changed Python files
        shell: bash
        run: |
          set -euo pipefail
          ruff format \
            app/main.py \
            app/schemas.py \
            app/services/matching.py \
            scripts/check_chain_links_browser.py \
            tests/test_chain_link_options.py \
            tests/test_simplified_experience.py
      - name: Regenerate OpenAPI contract
        run: python scripts/generate_openapi.py
      - name: Verify focused regressions
        shell: bash
        run: |
          set -euo pipefail
          ruff check \
            app/main.py \
            app/schemas.py \
            app/services/matching.py \
            scripts/check_chain_links_browser.py \
            tests/test_chain_link_options.py \
            tests/test_simplified_experience.py
          pytest -q tests/test_chain_link_options.py tests/test_simplified_experience.py
          node --check app/static/app-core.js
          git diff --check
      - name: Commit verified product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/simplified-experience.yml \
            app/main.py \
            app/schemas.py \
            app/services/matching.py \
            app/static/app-core.js \
            app/static/styles-original.css \
            docs/USER_GUIDE_SIMPLE.md \
            docs/openapi.json \
            scripts/check_chain_links_browser.py \
            tests/test_chain_link_options.py \
            tests/test_simplified_experience.py
          git status --short
          git commit -m "RC6 Manual Links: supervised attach, detach and reanalysis"
      - name: Push verified product changes
        run: git push origin HEAD:codex/rc6-manual-links
