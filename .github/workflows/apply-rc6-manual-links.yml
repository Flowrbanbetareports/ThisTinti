# Temporary transport workflow; exports the already verified product files as an artifact.
name: Apply RC6 Manual Links Patch

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".automation/rc6-manual-links.patch.gz.b64"
      - ".automation/rc6-manual-links.patch.gz.b64.part*"
      - ".github/workflows/apply-rc6-manual-links.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apply-rc6-manual-links-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'codex/rc6-manual-links'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: codex/rc6-manual-links
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Reassemble and apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          cat .automation/rc6-manual-links.patch.gz.b64.part* | base64 --decode | gzip -dc > /tmp/rc6-manual-links.patch
          git apply --check /tmp/rc6-manual-links.patch
          git apply /tmp/rc6-manual-links.patch
      - name: Install locked development dependencies
        run: pip install -r requirements-dev.txt
      - name: Format changed Python files
        shell: bash
        run: |
          set -euo pipefail
          ruff format \
            app/main.py \
            app/schemas.py \
            app/services/matching.py \
            scripts/check_chain_links_browser.py \
            tests/test_chain_link_options.py \
            tests/test_simplified_experience.py
      - name: Regenerate OpenAPI contract
        run: python scripts/generate_openapi.py
      - name: Verify focused regressions
        shell: bash
        run: |
          set -euo pipefail
          ruff check \
            app/main.py \
            app/schemas.py \
            app/services/matching.py \
            scripts/check_chain_links_browser.py \
            tests/test_chain_link_options.py \
            tests/test_simplified_experience.py
          pytest -q tests/test_chain_link_options.py tests/test_simplified_experience.py
          node --check app/static/app-core.js
          git diff --check
      - name: Package verified product files
        shell: bash
        run: |
          set -euo pipefail
          tar -czf rc6-manual-links-verified.tgz \
            .github/workflows/simplified-experience.yml \
            app/main.py \
            app/schemas.py \
            app/services/matching.py \
            app/static/app-core.js \
            app/static/styles-original.css \
            docs/USER_GUIDE_SIMPLE.md \
            docs/openapi.json \
            scripts/check_chain_links_browser.py \
            tests/test_chain_link_options.py \
            tests/test_simplified_experience.py
          sha256sum rc6-manual-links-verified.tgz > rc6-manual-links-verified.tgz.sha256
      - name: Upload verified product files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rc6-manual-links-verified-${{ github.run_id }}
          path: |
            rc6-manual-links-verified.tgz
            rc6-manual-links-verified.tgz.sha256
          retention-days: 7
