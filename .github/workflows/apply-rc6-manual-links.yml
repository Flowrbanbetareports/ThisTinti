name: Apply RC6 Manual Links Patch

on:
  push:
    branches:
      - codex/rc6-manual-links
    paths:
      - ".automation/rc6-manual-links.patch.gz.b64"
      - ".github/workflows/apply-rc6-manual-links.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-rc6-manual-links-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .automation/rc6-manual-links.patch.gz.b64 | gzip -dc > /tmp/rc6-manual-links.patch
          git apply --check /tmp/rc6-manual-links.patch
          git apply /tmp/rc6-manual-links.patch
      - name: Install locked development dependencies
        run: pip install -r requirements-dev.txt
      - name: Normalize Python and generated contracts
        shell: bash
        run: |
          set -euo pipefail
          ruff format \
            app/main.py \
            app/schemas.py \
            app/services/matching.py \
            scripts/check_chain_links_browser.py \
            tests/test_chain_link_options.py \
            tests/test_simplified_experience.py
          python scripts/generate_openapi.py
      - name: Verify focused regressions
        shell: bash
        run: |
          set -euo pipefail
          ruff check \
            app/main.py \
            app/schemas.py \
            app/services/matching.py \
            scripts/check_chain_links_browser.py \
            tests/test_chain_link_options.py \
            tests/test_simplified_experience.py
          pytest -q tests/test_chain_link_options.py tests/test_simplified_experience.py
          node --check app/static/app-core.js
          git diff --check
      - name: Commit product changes and remove transport files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .automation/rc6-manual-links.patch.gz.b64
          rm -f .github/workflows/apply-rc6-manual-links.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "RC6 Manual Links: supervised attach, detach and reanalysis"
          git push origin HEAD:codex/rc6-manual-links
