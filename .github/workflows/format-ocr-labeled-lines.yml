name: Patch and Format OCR Labeled Lines

on:
  push:
    branches:
      - agent/ocr-labeled-lines
    paths:
      - .github/workflows/format-ocr-labeled-lines.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: agent/ocr-labeled-lines
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Preserve OCR fields across visual blank lines and format
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("app/parsers/pdf_text.py")
          source = path.read_text(encoding="utf-8")
          old = "            if not raw_line.strip() and fields:\n                flush()\n"
          if source.count(old) != 1:
              raise SystemExit("Expected OCR blank-line block not found exactly once")
          path.write_text(source.replace(old, "", 1), encoding="utf-8")
          PY
          python -m pip install ruff==0.15.22
          ruff format app/parsers/pdf_text.py tests/test_parsers.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/parsers/pdf_text.py tests/test_parsers.py
          git commit -m "Keep labeled OCR rows across visual blank lines"
          git push origin HEAD:agent/ocr-labeled-lines
